<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANG-E EXAM — เตรียมสอบช่างอิเล็กทรอนิกส์</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230e1512'/%3E%3Cpath d='M20 50h15M65 50h15M50 20v15M50 65v15' stroke='%232fdc84' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='16' fill='none' stroke='%232fdc84' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c1210;
  --bg-2:#0f1613;
  --panel:#141e19;
  --panel-2:#1b2721;
  --border:#2a3b33;
  --steel:#4a5a53;
  --steel-light:#7c8d85;
  --pcb:#2fdc84;
  --pcb-dim:#1d9e5f;
  --pcb-glow:rgba(47,220,132,0.35);
  --copper:#e0993f;
  --copper-dim:#a86c28;
  --text:#e7f2ec;
  --text-dim:#93a89d;
  --danger:#f0555b;
  --danger-dim:#5c2226;
  --success:#2fdc84;
  --radius:10px;
  --mono:'Share Tech Mono','JetBrains Mono',ui-monospace,monospace;
  --sans:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(47,220,132,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(224,153,63,0.05), transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  line-height:1.55;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(47,220,132,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47,220,132,0.035) 1px, transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
}
#app{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:20px 16px 60px;}
a{color:var(--pcb)}
h1,h2,h3{font-family:var(--mono); letter-spacing:0.03em; margin:0 0 8px;}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0 0 10px; color:var(--text-dim)}
.brandbar{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.brand-badge{
  width:46px;height:46px;border-radius:10px;
  background:linear-gradient(145deg,var(--panel-2),var(--panel));
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(47,220,132,0.08), 0 0 18px rgba(47,220,132,0.15);
  font-size:22px;
}
.brand-title{font-family:var(--mono); font-size:1.15rem; letter-spacing:0.06em; color:var(--pcb); text-shadow:0 0 14px var(--pcb-glow);}
.brand-sub{font-size:0.78rem; color:var(--text-dim);}
.card{
  background:linear-gradient(160deg, var(--panel), var(--panel-2));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 24px rgba(0,0,0,0.35);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--pcb), transparent);
  opacity:0.5;
}
.field{margin-bottom:14px;}
.field label{display:block; font-size:0.82rem; color:var(--text-dim); margin-bottom:5px; font-family:var(--mono);}
.field input, .field select{
  width:100%; padding:11px 12px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg-2); color:var(--text);
  font-size:0.98rem; font-family:var(--sans);
}
.field input:focus, .field select:focus{outline:none; border-color:var(--pcb); box-shadow:0 0 0 3px rgba(47,220,132,0.15);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel-2); color:var(--text); cursor:pointer;
  font-family:var(--sans); font-size:0.95rem; font-weight:600;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  text-decoration:none;
}
.btn:hover{transform:translateY(-1px); border-color:var(--steel-light);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg, var(--pcb-dim), var(--pcb)); color:#062015; border-color:var(--pcb); font-weight:700;}
.btn-primary:hover{box-shadow:0 0 20px var(--pcb-glow);}
.btn-copper{background:linear-gradient(135deg, var(--copper-dim), var(--copper)); color:#241100; border-color:var(--copper); font-weight:700;}
.btn-ghost{background:transparent;}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.muted{color:var(--text-dim); font-size:0.85rem;}
.error-box{background:rgba(240,85,91,0.1); border:1px solid var(--danger-dim); color:#ffb3b6; padding:10px 12px; border-radius:8px; font-size:0.88rem; margin-bottom:12px;}
.success-box{background:rgba(47,220,132,0.08); border:1px solid var(--pcb-dim); color:var(--pcb); padding:10px 12px; border-radius:8px; font-size:0.88rem; margin-bottom:12px;}
.qr-panel{background:rgba(47,220,132,0.06); border:1px solid var(--pcb-dim); border-radius:12px; padding:18px; text-align:center; margin:16px 0;}
.qr-panel img{background:#fff; padding:10px; border-radius:10px; width:180px; height:180px; display:block; margin:12px auto;}
.qr-panel .username-chip{display:inline-block; background:var(--panel-2); border:1px solid var(--border); color:var(--pcb); font-family:var(--mono); padding:4px 10px; border-radius:6px; margin:4px 0;}
.subject-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
.subject-card{
  background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:.15s;
}
.subject-card:hover{border-color:var(--pcb); box-shadow:0 0 16px rgba(47,220,132,0.12);}
.subject-icon{font-size:1.6rem; margin-bottom:6px;}
.subject-name{font-size:0.92rem; font-weight:600;}
.subject-count{font-size:0.78rem; color:var(--text-dim); font-family:var(--mono);}
.top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.reading-article h2{margin-top:0;}
.reading-body{line-height:1.7; font-size:0.96rem;}
.reading-body h2{font-size:1.25rem; color:var(--pcb); margin:22px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px;}
.reading-body h3{font-size:1.1rem; color:var(--pcb); margin:18px 0 8px;}
.reading-body h4,.reading-body h5{font-size:1rem; margin:14px 0 6px; color:var(--text);}
.reading-body p{margin:0 0 12px;}
.reading-body ul,.reading-body ol{margin:0 0 12px; padding-left:22px;}
.reading-body li{margin-bottom:6px;}
.reading-body strong{color:var(--pcb);}
.reading-body em{color:var(--text-dim);}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:0.72rem; padding:3px 10px; border-radius:999px;
  border:1px solid var(--border); color:var(--text-dim); background:var(--bg-2);
}
.pill.on{border-color:var(--pcb); color:var(--pcb);}
.progressbar{height:6px; background:var(--bg-2); border-radius:999px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border);}
.progressbar-fill{height:100%; background:linear-gradient(90deg,var(--pcb-dim),var(--pcb)); transition:width .25s;}
.q-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:var(--mono); font-size:0.78rem; color:var(--text-dim);}
.q-text{font-size:1.06rem; margin-bottom:14px; white-space:pre-wrap;}
.q-image{max-width:100%; border-radius:8px; border:1px solid var(--border); background:#fff; padding:10px; margin-bottom:14px; display:block;}
.choice-list{display:flex; flex-direction:column; gap:10px;}
.choice-btn{
  display:flex; align-items:center; gap:12px; text-align:left;
  padding:13px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-2); color:var(--text); cursor:pointer; font-size:0.95rem;
  font-family:var(--sans); width:100%;
}
.choice-btn:hover{border-color:var(--steel-light);}
.choice-letter{
  font-family:var(--mono); width:26px; height:26px; border-radius:6px;
  background:var(--panel-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.8rem;
}
.choice-btn.selected{border-color:var(--copper); background:rgba(224,153,63,0.08);}
.choice-btn.selected .choice-letter{background:var(--copper); color:#241100; border-color:var(--copper);}
.choice-btn.correct{border-color:var(--pcb); background:rgba(47,220,132,0.1);}
.choice-btn.correct .choice-letter{background:var(--pcb); color:#062015;}
.choice-btn.wrong{border-color:var(--danger); background:rgba(240,85,91,0.08);}
.choice-btn.wrong .choice-letter{background:var(--danger); color:#2a0709;}
.choice-btn:disabled{cursor:default;}
.timer{font-family:var(--mono); font-size:1rem; color:var(--copper);}
.timer.low{color:var(--danger); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.score-hero{text-align:center; padding:26px 10px;}
.score-num{font-family:var(--mono); font-size:3rem; color:var(--pcb); text-shadow:0 0 26px var(--pcb-glow);}
.score-label{color:var(--text-dim); font-size:0.9rem;}
table{width:100%; border-collapse:collapse; font-size:0.88rem;}
th,td{padding:9px 8px; border-bottom:1px solid var(--border); text-align:left;}
th{font-family:var(--mono); font-size:0.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}
.status-badge{font-family:var(--mono); font-size:0.7rem; padding:2px 8px; border-radius:999px; border:1px solid;}
.status-pending{color:var(--copper); border-color:var(--copper);}
.status-active{color:var(--pcb); border-color:var(--pcb);}
.status-suspended{color:var(--danger); border-color:var(--danger);}
.footer-version{
  text-align:center; margin-top:30px; font-family:var(--mono); font-size:0.72rem; color:var(--text-dim);
}
.footer-version.ok{color:var(--pcb);}
.footer-version.bad{color:var(--danger);}
.tab-row{display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid var(--border);}
.tab-btn{
  background:none; border:none; color:var(--text-dim); padding:9px 4px; cursor:pointer;
  font-family:var(--mono); font-size:0.85rem; border-bottom:2px solid transparent;
}
.tab-btn.active{color:var(--pcb); border-bottom-color:var(--pcb);}
.spinner{
  width:22px;height:22px;border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--pcb);
  animation:spin 0.8s linear infinite; margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center;}
.hidden{display:none !important;}
.link-btn{background:none;border:none;color:var(--pcb);cursor:pointer;font-family:var(--sans);font-size:0.85rem;text-decoration:underline;padding:0;}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(6,10,8,0.75); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal-box{max-width:380px; width:100%;}
::selection{background:var(--pcb); color:#062015;}
</style>
</head>

<script id="reading-data" type="application/json">[{"id": "doctrine", "title": "หลักนิยมการสื่อสารทางยุทธวิธี", "icon": "📖", "body": "## สรุปเนื้อหา วิชาหลักนิยมการสื่อสารทางยุทธวิธี (สำหรับหลักสูตรนายสิบชั้นต้น)\n\n## บทที่ 1 บทนำ\n\n**ความมุ่งหมาย** หนังสือเล่มนี้เป็นแนวทาง (ไม่ใช่ตำราเทคนิค) สำหรับผู้บังคับบัญชา นายทหารฝ่ายอำนวยการ และผู้เกี่ยวข้องกับการสื่อสารทุกระดับหน่วยของกองทัพบก ใช้ได้ทั้งสงครามปรมาณูและมิใช่ปรมาณู\n\n**นิยามศัพท์สำคัญ** — **การสื่อสารทางยุทธวิธี** คือ ระบบการสื่อสารและเครื่องมือสื่อสารที่สนับสนุนกองทัพบกในสนามรบ ตั้งแต่กองบัญชาการกองทัพบกยุทธบริเวณลงไปถึงหน่วยรบต่ำสุด ใช้เพื่อการบังคับบัญชา ควบคุม และสนับสนุนการรบ มีลักษณะ **ระยะสั้น** (ต่างจากการสื่อสารทางยุทธศาสตร์ที่ควบคุมแบบรวมการทั่วโลก) และใช้เครื่องมือชนิดหอบหิ้ว บรรทุกพาหนะ หรือเคลื่อนที่ได้\n\n## บทที่ 2 ความรับผิดชอบ หลักการ และเครื่องมือในการสื่อสารทางยุทธวิธี\n\n### ตอนที่ 1 ความรับผิดชอบในการวางการสื่อสารและซ่อมบำรุง\n\nหลักทั่วไป: **ผู้บังคับบัญชาแต่ผู้เดียวรับผิดชอบ** ให้มีระบบสื่อสารในหน่วยอย่างเพียงพอ แม้จะมอบอำนาจให้หน่วยรองวาง/บำรุงรักษา/ควบคุมเครื่องมือได้ แต่ **ความรับผิดชอบไม่อาจมอบหมายให้ผู้อื่นได้**\n\nหลักการกำหนดความรับผิดชอบระหว่างหน่วย (จุดที่มักออกข้อสอบ):\n- **หน่วยเหนือ → หน่วยรอง**: หน่วยเหนือรับผิดชอบวาง/ซ่อมบำรุงไปยังหน่วยรอง (รวมถึงหน่วยสมทบ ซึ่งถือเป็นหน่วยรองของหน่วยที่ตนไปสมทบ)\n- **หน่วยสนับสนุน → หน่วยรับการสนับสนุน**: ผู้บังคับหน่วยที่ให้การสนับสนุนรับผิดชอบ\n- **หน่วยเพิ่มเติมกำลัง → หน่วยรับการเพิ่มเติมกำลัง**: หน่วยที่ไปเพิ่มเติมกำลังเป็นผู้รับผิดชอบ\n- **การสื่อสารทางข้าง**: ถ้าไม่มีคำสั่งกำหนดไว้ชัดเจน **หน่วยทางซ้ายรับผิดชอบวางการสื่อสารไปยังหน่วยทางขวา**\n- **การสนับสนุนใช้ร่วม**: หน่วยทหารสื่อสารรับผิดชอบวาง/ปฏิบัติการสื่อสารใช้ร่วมสำหรับหน่วยรบ หน่วยสนับสนุนการรบ และหน่วยบริการสนับสนุนการรบ ถือเป็น \"การเพิ่มเติม\" ไม่ใช่การช่วยเสริมขีดความสามารถตามอัตรา\n\n### ตอนที่ 2 หลักการสื่อสาร (7 ประการ) — ที่มาจากหลักเบื้องต้นของสงคราม (รส.100-5)\n\n1. **ข้อจำกัดในการใช้** — เครื่องมือสื่อสารมีไว้สำหรับผู้บังคับบัญชาและเจ้าหน้าที่ที่กำหนดเท่านั้น ใช้ให้น้อยที่สุดแต่สนองภารกิจได้\n2. **ความเหมาะสมในการใช้เครื่องมือ** — เลือกโดยเปรียบเทียบ ความเร่งด่วน เวลาติดตั้ง เวลาส่ง จุดอ่อนต่อข้าศึก ความเชื่อถือได้ และราคา ปัจจัยสำคัญที่สุดคือความเร่งด่วนทางยุทธวิธี\n3. **ความอ่อนตัว** — ต้องปรับเข้ากับสถานการณ์ที่ผันแปรได้\n4. **การกระจายกำลัง** — ไม่รวมเครื่องมือไว้มากเกินไปเพื่อลดการเป็นเป้าหมายและการดักรับ\n5. **ความง่ายในการปฏิบัติงาน**\n6. **เครื่องมือประจำหน่วย** — หน่วยตั้งแต่กองพลน้อยลงไปใช้เครื่องมือประจำหน่วย ส่วนกองพลขึ้นไปใช้ระบบใช้ร่วม (หน่วยทหารสื่อสารติดตั้งให้)\n7. **การรักษาความปลอดภัย** — ต้องชั่งใจระหว่างความปลอดภัยกับความเร่งด่วนทางยุทธ\n\n### ตอนที่ 3 ชนิด ขีดความสามารถ และข้อจำกัดของเครื่องมือสื่อสาร\n\n**คุณสมบัติหลัก 3 ประการที่ต้องพิจารณาถ่วงดุลกันเสมอ**: ความเชื่อถือได้ (Reliability), ความปลอดภัย (Security), ความรวดเร็ว (Speed)\n\n**ประเภทเครื่องมือสื่อสาร 6 ประเภท:**\n\n1. **การนำสาร** — ปลอดภัยที่สุด เหมาะกับข่าวยาว/จำนวนมาก มีข้อจำกัดคือถูกข้าศึกทำอันตรายได้ง่าย แบ่งเป็นชนิดกำหนดเวลา/ชนิดพิเศษ อัตราความเร็ว: พลนำสารเดินเท้า 3-5 ไมล์/ชม.(กลางวัน) 2-4(กลางคืน); ยานยนต์ 25-40/15-30; ทางอากาศ 80 ขึ้นไป ข่าวสำคัญอาจใช้ **พลนำสารคู่**\n2. **การสื่อสารประเภททัศนะ** — ธง แสง ดอกไม้เพลิง แผ่นผ้า แขน/มือสัญญาณ ใช้ส่งข่าวเร่งด่วนระยะสั้น พิสูจน์ฝ่าย ข้าศึกดักรับไม่ได้เหมือนวิทยุ/โทรศัพท์ แต่จำกัดด้วยทัศนวิสัย\n3. **การสื่อสารประเภทเสียง** — นกหวีด ไซเรน ระฆัง ใช้ระยะใกล้ ดึงดูดความสนใจ/เตือนภัย\n4. **วิทยุและสาย** (สำคัญที่สุด):\n   - **วิทยุ**: ติดตั้งเร็ว เชื่อมต่อพื้นที่ห่างไกล/มีสิ่งขวางกั้นได้ แต่ **ปลอดภัยน้อยที่สุด** ถือว่าข้าศึกดักรับได้ทุกขณะที่ส่ง มาตรการป้องกัน: การระงับวิทยุ (ปิดทั้งเครื่องรับ-ส่ง) กับ **การห้ามส่งวิทยุ** (ยอมให้เครื่องรับทำงานได้ ห้ามเฉพาะเครื่องส่ง) และการเข้าอักษรลับ\n   - ย่านความถี่: ถส.(HF) ถสม.(VHF) ถสอ.(UHF) — ถสม./ถสอ. จำกัดแค่เส้นสายตา ส่วน ถส. ทำงานได้ระยะไกลกว่า\n   - **การสนธิวิทยุ/สาย (RWI)** — เชื่อมวิทยุเคลื่อนที่กับระบบโทรศัพท์ผ่านวิธีกดแล้วพูด มีประโยชน์ 9 ประการ (เช่น สื่อสารฉุกเฉิน เชื่อมสถานีที่ไกลเกินรัศมี ฯลฯ)\n   - **สาย**: เชื่อถือได้ดีที่สุด สนทนาโต้ตอบแบบชะงัก (Break-in) ได้ ปลอดภัยกว่าวิทยุ ระยะทำงาน 22-35 กม.(หม้อไฟฟ้า) หรือ 5-16 กม.(กำลังเสียง) แต่ติดตั้งใช้เวลานานที่สุด\n   - **วิทยุถ่ายทอด** — เพิ่มระยะด้วยเครื่องเพิ่มช่องการสื่อสาร (Multiplexes) จำกัดระยะเส้นสายตา แก้ไขได้ด้วยการกระจายคลื่นชั้นโทรโปสเฟียริคสแคตเตอร์\n5. **การสื่อสารประเภททัศนะและภาพ** — ภาพถ่าย โทรสำเนา โทรทัศน์ ใช้เพื่อยุทธศาสตร์/ยุทธการ/ข่าวกรองเทคนิค\n6. **อุปกรณ์ช่วย** — เครื่องกรรมวิธีข้อมูล เครื่องขยายกลางทาง เครื่องเพิ่มช่องการสื่อสาร\n\n## บทที่ 3 การรักษาความปลอดภัยในการสื่อสาร (รปภส.)\n\n**นิยาม**: ผลลัพธ์ในการป้องกันจากมาตรการทั้งหมดที่ขัดขวางมิให้ผู้ไม่มีสิทธิได้รับข่าว ประกอบด้วย 3 ด้าน: **(1) การรักษาความปลอดภัยทางวัตถุ (2) ทางการอักษรลับ (3) ทางการส่งข่าว**\n\n**ความรับผิดชอบ**: เป็นความรับผิดชอบทางการบังคับบัญชา แต่ก็เป็นหน้าที่ของทุกคน ผู้บังคับหน่วยได้รับความช่วยเหลือจาก สธ.2/ฝอ.2 (ข่าวกรอง) สารวัตรใหญ่ และผู้บังคับทหารสื่อสาร มาตรการสำคัญ 7 ข้อ ได้แก่ กำหนดหลักการใน รปจ., รักษาระบบควบคุมบัญชีข่าวสารอักษรลับ, ตรวจสอบตามระยะเวลา, จัดทำแผนทำลายยามฉุกเฉิน, พิจารณาในการวางแผนยุทธ, แก้ไขการฝ่าฝืน, และอบรมสำนึกความปลอดภัย\n\n**การกำหนดชั้นความลับ**: ควรเข้าอักษรลับ/เข้ารหัสถ้ามีเครื่อง ในการรบจริงอาจส่งข้อความธรรมดาได้ทุกชั้นความลับ **ยกเว้นชั้นลับที่สุด** ซึ่งห้ามส่งเป็นข้อความธรรมดาโดยเด็ดขาด\n\n**การรักษาความปลอดภัยทางวัตถุ**: มาตรการทางวัตถุเพื่อพิทักษ์ข่าวสารและวัสดุการอักษรลับมิให้ตกไปอยู่ในมือผู้ไม่ได้รับอนุมัติ วัสดุที่กำหนดชั้นความลับเมื่อจำเป็นต้องทำลาย ให้ทำลายด้วยการเผาไฟ\n\n**การรักษาความปลอดภัยทางการอักษรลับ**: เกี่ยวข้องกับการใช้ประมวลลับ เครื่องรหัส ผู้ที่จะเข้าถึงวัสดุอักษรลับต้องผ่านการพิสูจน์ความไว้วางใจและได้รับอนุมัติเป็นทางการ (ยศอย่างเดียวไม่ใช่เครื่องรับประกันสิทธิ์)\n\n**การรักษาความปลอดภัยทางการส่งข่าว**: ป้องกันการดักรับ การวิเคราะห์ข่าว การลวงด้วยการเลียนแบบ และการหาทิศ\n\n**ตารางกำหนดความเร่งด่วนของข่าว (4 ระดับ)**: ด่วนที่สุด (ดส.) — สงวนสำหรับการปะทะข้าศึกครั้งแรก/ปฏิบัติการเร่งด่วน; ด่วนมาก (ดม.); ด่วน (ด.); ปกติ (ป.) — การกำหนดความเร่งด่วนผิดพลาดจะทำให้ระบบสื่อสารรับภาระเกินและเปิดช่องให้ฝ่าฝืนความปลอดภัย\n\n**มาตรการป้องกันการดักรับและหาทิศวิทยุ**: หลีกเลี่ยงการส่งข่าวที่ไม่จำเป็น ใช้กำลังส่งน้อยที่สุด เข้าอักษรลับคำแนะนำเปลี่ยนความถี่ ปรับเครื่องส่งให้ถูกต้องตามความถี่ที่ได้รับอนุมัติ\n\n**ข้อบกพร่องที่ทำลายความปลอดภัยทางการส่งข่าว** (10 ข้อ ที่พึงหลีกเลี่ยง): ฝ่าฝืนการระงับวิทยุ, สนทนาเรื่องส่วนตัว, ส่งข่าวในข่ายบังคับโดยไม่ได้รับอนุมัติ, ใช้คำย่อ/นามเรียกขานที่ไม่ได้รับอนุมัติหรือซ้ำนานเกินไป, ใช้ภาษาธรรมดาแทนคำย่อระเบียบการ, เปิดเผยที่ตั้งหน่วย, บกพร่องในการเฝ้าวิทยุ, ส่งข่าวเร็วเกินความสามารถผู้รับ, ใช้กำลังส่งมากเกินไป, ใช้เวลาปรับตั้ง/ทดลอง/ส่งข่าวนานเกินควร\n\n**การก่อกวนของข้าศึก**: การส่งสัญญาณรบกวนการรับ แก้ไขด้วย **มาตรการตอบโต้ทางอิเล็กทรอนิกส์ (มตตอ.)** พนักงานวิทยุต้องใช้เครื่องทำงานต่อไประหว่างถูกก่อกวน และต้องรายงานทันทีเพราะการก่อกวนมักเป็นส่วนหนึ่งของแผนก่อนการรบสำคัญ\n\n**ความปลอดภัยทางโทรศัพท์**: วงจรโทรศัพท์อาจผ่านทั้งสายและวิทยุร่วมกัน จึงไม่ปลอดภัยเสมอไปแม้ผู้ใช้เข้าใจผิดว่าปลอดภัยกว่าวิทยุ\n\n## บทที่ 4 การใช้การสื่อสารทางยุทธวิธี\n\n### ตอนที่ 1 การสื่อสารตามระดับหน่วย\n\nความต้องการเบื้องต้น: ความรวดเร็ว ความเชื่อถือได้ ความปลอดภัย และต้องเปลี่ยนเส้นทาง (Re-route) ได้เมื่อเครื่องมือถูกทำลาย\n\n- **ระดับกองร้อย**: พูดโต้ตอบสั้น ๆ ระยะใกล้ ไม่ต้องบันทึก ใช้วิทยุ ถสม./ปถ. ชนิดติดหลัง/บนยานยนต์ และโทรศัพท์สนาม\n- **ระดับกองพัน**: ความต้องการกว้างขึ้น ต้องบันทึกข่าวทั้งลับและไม่ลับ ใช้ วิทยุ ถสม./ปถ. + วิทยุโทรพิมพ์/SSB ความถี่สูงเชื่อมหน่วยเหนือ\n- **ระดับกองพลน้อย**: เป็นส่วนปลายทางเชื่อมกับระบบกองพล ใช้วิทยุถ่ายทอดหลายช่อง/เคเบิล วิทยุเป็นเครื่องมือหลัก มีข่ายบังคับบัญชาและข่ายธุรการ/ส่งกำลังบำรุง\n- **ระดับกองพล**: ใช้ระบบหลายช่อง/หลายเส้นหลัก มีศูนย์การสัญญาณ (หลัก สำรอง ส่วนหลัง) กองพันทหารสื่อสารกองพลเป็นผู้ติดตั้งปฏิบัติงาน\n- **ระดับกองทัพน้อย**: การสื่อสารหลายช่อง/หลายเส้นหลักเพิ่มขึ้นชัดเจน วิทยุติดยานยนต์ลดลง หันมาใช้โทรศัพท์/โทรพิมพ์มากขึ้น\n- **ระดับกองทัพสนาม**: ใช้ศูนย์การสัญญาณประจำพื้นที่ วิทยุถ่ายทอดหลายช่อง สายเคเบิล ครอบคลุมทั้งเขตการรบ\n- **ระดับกองทัพบกยุทธบริเวณ**: เชื่อมกับระบบป้องกันทั่วโลก มีศูนย์ควบคุม ศูนย์ควบคุมย่อย ศูนย์สลับทาง (Switching Center) — อัตราส่วน 1 ศูนย์สลับสายต่อ 3 ศูนย์ควบคุม\n\n### ตอนที่ 2 การสื่อสารในขั้นตอนต่าง ๆ ของการปฏิบัติทางยุทธวิธี\n\n- **พื้นที่รวมพล**: เน้นการรักษาความปลอดภัย ห้ามใช้ทัศนสัญญาณ/เสียงสัญญาณ วิทยุมักห้ามใช้/ระงับ ยกเว้นเตือนภัย ใช้การนำสารเป็นหลัก\n- **การเดินและพัก**: แบ่งเป็นการเคลื่อนย้ายทางยุทธวิธี (ใช้นำสาร ทัศนสัญญาณเป็นหลัก วิทยุจำกัด) กับทางธุรการ (ใช้วิทยุและนำสารเป็นหลัก)\n- **การเคลื่อนที่เข้าปะทะ**: ควบคุมวิทยุอย่างเคร่งครัดเพื่อผลการจู่โจม อาจใช้ข่าวลวงรักษาระดับปริมาณข่าว\n- **การรบด้วยวิธีรุก** (เข้าตีตรงหน้า/เข้าตีโอบ/ขยายผล/ไล่ติดตาม): ก่อนปะทะระงับวิทยุ/เงียบฟัง หลังปะทะวิทยุถ่ายทอดกลายเป็นเครื่องมือหลัก ในขั้นขยายผลวิทยุเหมาะที่สุดเพราะอัตราเคลื่อนที่เร็ว\n- **การตั้งรับ**: ระบบสื่อสารประณีตกว่าการเข้าตี สายเป็นหลักถ้าตั้งรับแบบพื้นที่ วิทยุ/นำสารเป็นหลักถ้าตั้งรับแบบคล่องตัว\n- **การร่นถอย**: ใช้เครื่องมือเดิมให้มากที่สุด อาจตั้งสถานีวิทยุลวงที่ที่มั่นเก่าเพื่อรักษาระดับปริมาณข่าว\n- **การผ่านแนวและการสับเปลี่ยน**: ประสานงานใกล้ชิดระหว่างผู้บังคับทหารสื่อสารของหน่วยที่เกี่ยวข้อง จำกัดการสื่อสารของหน่วยที่จะผ่าน ให้ใช้วงจรของหน่วยที่ยึดที่มั่นให้มากที่สุด\n\n### ตอนที่ 3 การใช้การสื่อสารในโอกาสอื่น ๆ\n\n- **การยุทธส่งทางอากาศ**: วางแผนล่วงหน้า ผู้บังคับหน่วยบินลำเลียงจัดการสื่อสารให้กองทหารส่งทางอากาศ\n- **การยุทธเคลื่อนที่ทางอากาศ**: ใช้ข่ายวิทยุเป็นหลัก \"ความเร็ว\" คือหัวใจสำคัญ\n- **การยุทธสะเทินน้ำสะเทินบก**: ผู้บังคับหน่วยรบเฉพาะกิจร่วม (ปกติ ทร.) รับผิดชอบประสานงาน ระยะแรกใช้วิทยุเป็นหลัก\n- **การข้ามลำน้ำ**: ต้องมีมัชฌิมการสื่อสารเหมาะสมข้ามไปกับส่วนบุกด้วย นำสารเป็นเครื่องมือหลักช่วงแรก\n- **พื้นที่ดัดแปลง / ป่า / ปฏิบัติการต่อต้านปราบปรามการก่อความไม่สงบ (ตปส.) / สงครามกองโจร**: วิทยุเป็นเครื่องมือหลักเนื่องจากทางสายไม่ปลอดภัย/ติดตั้งยาก\n- **การยุทธร่วม/ยุทธผสม**: ต้องสนธิระบบสื่อสารของกำลังต่างเหล่าทัพ/ชาติเข้าเป็นระบบเดียว อ้างอิงบรรณสารสื่อสารพันธมิตร (บสพ.) และบรรณสารร่วม (บสร.) ต้องมีล่ามประจำศูนย์การสัญญาณ\n\n### ตอนที่ 4 การสื่อสารในสภาพภูมิศาสตร์พิเศษ\n\n- **อากาศหนาว**: เครื่องขัดข้องบ่อย ต้องมีอุปกรณ์พิเศษ (หม้อไฟแบบอาร์คติค) พลนำสารระยะไกลควรใช้เป็นคู่ วิทยุ VHF/UHF ได้ผลดีกว่า HF (กระทบจากไอออนอสเฟียร์น้อยกว่า) ต้องทำสายดินแบบแผ่กระจาย (Counterpoise)\n- **ทะเลทราย**: พลนำสารเดินเท้าใช้ไม่ได้ผล วิทยุใช้ได้กว้างขวางและระยะไกลขึ้นได้ด้วยสายอากาศพิเศษ ทางสายได้ผลน้อยเพราะยานพาหนะทำให้สายขาด\n- **ป่า**: ทัศนวิสัย/การเคลื่อนที่ลดลงมาก วิทยุความถี่สูง (HF) อาจใช้แทน VHF/UHF ได้เพราะทะลุป่าได้ดีกว่า สายไม่ปลอดภัยเพราะข้าศึกแทรกซึมเกาะสายได้ง่าย\n- **ภูเขา**: ทัศนสัญญาณได้ประโยชน์จากภูมิประเทศสูงเด่น (ระยะเส้นสายตาไกลขึ้น) วิทยุ FM ถูกภูมิประเทศกีดขวาง อาจต้องใช้สถานีส่งต่ออัตโนมัติบนที่สูง สายไว้วางใจได้มากแต่ติดตั้ง/ซ่อมบำรุงยาก"}, {"id": "elec", "title": "ไฟฟ้าและอิเล็กทรอนิกส์เบื้องต้น", "icon": "🔌", "body": "## โครงสร้างของอะตอมและที่มาของกระแสไฟฟ้า\n\n**อะตอม** เป็นหน่วยที่เล็กที่สุดของธาตุ ประกอบด้วยอนุภาค 3 ชนิด คือ **โปรตอน** (ประจุบวก) และ **นิวตรอน** (เป็นกลางทางไฟฟ้า) รวมกันอยู่ที่ใจกลางเรียกว่า **นิวเคลียส** ส่วน **อิเล็กตรอน** (ประจุลบ) จะโคจรอยู่รอบนิวเคลียสเป็นชั้น ๆ เรียกวงโคจรว่า K, L, M, N, O... จำนวนอิเล็กตรอนสูงสุดที่แต่ละวงจะรับได้คำนวณจากสูตร\n\n**จำนวนอิเล็กตรอนสูงสุดในแต่ละวง = 2N²** เมื่อ N คือลำดับวงโคจร (วง K: N=1 ได้ 2 ตัว, วง L: N=2 ได้ 8 ตัว, วง M: N=3 ได้ 18 ตัว, วง N: N=4 ได้ 32 ตัว)\n\nเมื่ออะตอมได้รับพลังงานหรือแรงกระตุ้น อิเล็กตรอนวงนอกสุด (วาเลนซ์อิเล็กตรอน) ซึ่งยึดเหนี่ยวกับนิวเคลียสหลวมที่สุดอาจหลุดออกไปเรียกว่า **อิเล็กตรอนอิสระ (Free Electron)** อะตอมที่เสียอิเล็กตรอนจะแสดงอำนาจไฟฟ้าเป็นบวก ส่วนอะตอมที่รับอิเล็กตรอนเพิ่มจะแสดงอำนาจเป็นลบ ความไม่สมดุลของประจุนี้ทำให้เกิด **ความต่างศักย์ไฟฟ้า** ซึ่งเป็นต้นกำเนิดของกระแสไฟฟ้า โดย **กระแสไฟฟ้าคือการเคลื่อนที่ของอิเล็กตรอนอิสระผ่านตัวนำจากขั้วลบไปขั้วบวก** (ในทางทฤษฎีวงจร กำหนดทิศทางกระแสไหลจากขั้วบวกไปลบ)\n\n## แหล่งกำเนิดไฟฟ้า\n\nไฟฟ้าเกิดขึ้นได้จาก 6 แหล่งกำเนิดหลัก ได้แก่\n\n1. **การเสียดสี/ขัดสี** ของวัตถุ 2 ชนิด เช่น แท่งยางกับผ้าขนสัตว์ แท่งแก้วกับผ้าแพร ทำให้เกิด **ไฟฟ้าสถิต**\n2. **ปฏิกิริยาเคมี** เช่น การนำโลหะต่างชนิด (สังกะสี-ทองแดง) จุ่มในสารละลายอิเล็กโทรไลต์ เกิดเป็นเซลล์ไฟฟ้า (โวลตาอิกเซลล์) หลักการเดียวกับแบตเตอรี่\n3. **ความร้อน** โดยนำโลหะต่างชนิด 2 แผ่นมาเชื่อมปลายด้านหนึ่งเข้าด้วยกัน (thermocouple) เมื่ออุณหภูมิที่จุดต่อทั้งสองต่างกันจะเกิดแรงเคลื่อนไฟฟ้า (ผลของซีเบค)\n4. **แสงสว่าง** สารบางชนิด (เช่นสารกึ่งตัวนำ) เมื่อถูกแสงจะปล่อยอิเล็กตรอนออกมา (photoelectric/photovoltaic effect)\n5. **แรงกดดัน** ผลึกบางชนิด เช่น ควอตซ์ เมื่อถูกกดจะเกิดประจุไฟฟ้า (piezoelectric effect)\n6. **สนามแม่เหล็ก** ตามหลักการเหนี่ยวนำแม่เหล็กไฟฟ้าของฟาราเดย์ เมื่อตัวนำเคลื่อนที่ตัดผ่านสนามแม่เหล็ก (หรือสนามแม่เหล็กเคลื่อนที่ตัดผ่านตัวนำ) จะเกิดแรงดันไฟฟ้าเหนี่ยวนำขึ้น เป็นหลักการของเครื่องกำเนิดไฟฟ้า (generator)\n\n**ไฟฟ้ากระแส** แบ่งเป็น 2 ชนิด\n- **ไฟฟ้ากระแสตรง (DC)** ไหลทิศทางเดียวคงที่ตลอด มาจากถ่านไฟฉาย แบตเตอรี่ (แบตเตอรี่ปฐมภูมิ = ใช้ครั้งเดียวทิ้ง เช่น ถ่านไฟฉาย, แบตเตอรี่ทุติยภูมิ = ประจุไฟใหม่ได้ เช่น แบตเตอรี่รถยนต์) หากต่อแบตเตอรี่แบบ **อนุกรม** จะได้แรงดันสูงขึ้น หากต่อแบบ **ขนาน** จะได้กระแสสูงขึ้น\n- **ไฟฟ้ากระแสสลับ (AC)** ไหลกลับทิศทางตลอดเวลา รูปคลื่นเป็นรูปซายน์ (sinusoidal wave) เกิดจากเครื่องกำเนิดไฟฟ้ากระแสสลับหมุนขดลวดตัดกับสนามแม่เหล็ก\n\n## หน่วยพื้นฐานทางไฟฟ้าและกฎของโอห์ม\n\nหน่วยพื้นฐาน ได้แก่ **กระแสไฟฟ้า (I)** หน่วยแอมแปร์ (A) — 1 แอมแปร์ คือปริมาณอิเล็กตรอน 6.25×10¹⁸ ตัวไหลผ่านจุดหนึ่งในเวลา 1 วินาที, **แรงดันไฟฟ้า/แรงเคลื่อนไฟฟ้า (V)** หน่วยโวลต์ (V) เปรียบเสมือนแรงดันน้ำที่ดันให้กระแส(น้ำ)ไหล และ **ความต้านทาน (R)** หน่วยโอห์ม (Ω) เปรียบเสมือนวาล์วที่ต้านการไหล\n\nตัวคูณหน่วยที่ควรจำ: Mega (M) = ×1,000,000, Kilo (K) = ×1,000, Milli (m) = ×0.001, Micro (µ) = ×0.000001\n\n**กฎของโอห์ม (Ohm's Law)** อธิบายความสัมพันธ์ระหว่างแรงดัน กระแส และความต้านทาน:\n\n**V = I × R**, **I = V/R**, **R = V/I**\n\nโดย V = แรงดันไฟฟ้า (โวลต์), I = กระแสไฟฟ้า (แอมแปร์), R = ความต้านทาน (โอห์ม)\n\nความหมายของ \"1 โอห์ม\" คือค่าความต้านทานที่ยอมให้กระแสไหลผ่านได้ 1 แอมแปร์ เมื่อมีแรงดัน 1 โวลต์ตกคร่อม\n\n**ค่าความนำไฟฟ้า (Conductance, G)** เป็นส่วนกลับของความต้านทาน G = 1/R มีหน่วยเป็นซีเมนส์ (S) หรือโมส์ (℧)\n\n## กำลังไฟฟ้า\n\n**กำลังไฟฟ้า (Power, P)** คือพลังงานไฟฟ้าที่ใช้ต่อหน่วยเวลา มีหน่วยเป็นวัตต์ (W) คำนวณได้จากสูตรที่สัมพันธ์กัน 3 รูปแบบ:\n\n**P = V × I**, **P = I²R**, **P = V²/R**\n\nตัวอย่างการประยุกต์: ไฟฟ้าในบ้านของไทยใช้ 220V, 50Hz หากเบรกเกอร์รับกระแสสูงสุด 15A กำลังไฟฟ้าสูงสุดที่วงจรรับได้ ≈ 220×15 = 3,300 W\n\n## วงจรไฟฟ้ากระแสตรง: อนุกรม ขนาน และกฎของเคอร์ชอฟฟ์\n\n**วงจรอนุกรม (Series)**\n- กระแสไฟฟ้าไหลทิศทางเดียวและมีค่า**เท่ากันทุกจุด**\n- แรงดันตกคร่อมอุปกรณ์แต่ละตัวไม่เท่ากัน แต่ผลรวมแรงดันทั้งหมดเท่ากับแรงดันแหล่งจ่าย\n- ความต้านทานรวม: **R_รวม = R₁ + R₂ + R₃ + ...**\n\n**วงจรขนาน (Parallel)**\n- แรงดันตกคร่อมอุปกรณ์ทุกตัว**เท่ากัน**และเท่ากับแรงดันแหล่งจ่าย\n- กระแสรวมเท่ากับผลรวมกระแสย่อยแต่ละสาขา\n- ความต้านทานรวม: **1/R_รวม = 1/R₁ + 1/R₂ + 1/R₃ + ...** (ค่ารวมจะน้อยกว่าค่าความต้านทานตัวที่น้อยที่สุดเสมอ) สำหรับตัวต้านทาน 2 ตัว: R_รวม = (R₁×R₂)/(R₁+R₂)\n\n**วงจรผสม** คือการนำวงจรอนุกรมและขนานมารวมกัน แก้โดยแบ่งคำนวณทีละส่วนย่อยแล้วนำมารวมกัน\n\n**กฎกระแสของเคอร์ชอฟฟ์ (KCL)**: ผลรวมทางพีชคณิตของกระแสไฟฟ้าที่ไหลเข้าและออกจากโนดใด ๆ มีค่าเท่ากับศูนย์ (กระแสไหลเข้า = กระแสไหลออก)\n\n**กฎแรงดันของเคอร์ชอฟฟ์ (KVL)**: ผลรวมทางพีชคณิตของแรงดันไฟฟ้ารอบวงปิดใด ๆ มีค่าเท่ากับศูนย์\n\nกฎทั้งสองนี้ใช้ร่วมกับกฎของโอห์มเป็นพื้นฐานในการวิเคราะห์วงจรไฟฟ้าที่ซับซ้อน\n\n## ตัวต้านทาน (Resistor)\n\n**หน้าที่**: จำกัดปริมาณการไหลของกระแสไฟฟ้าในวงจร มีหน่วยเป็นโอห์ม (Ω)\n\n**การแบ่งชนิดตามวัสดุ**\n- **วัสดุประเภทโลหะ**: ใช้ลวดหรือแถบลวดพันบนแกนฉนวน เช่น ตัวต้านทานแบบ**ไวร์วาวด์ (Wire Wound)** ให้ค่าแม่นยำ ทนกำลังไฟฟ้าสูง แต่มีขนาดใหญ่\n- **วัสดุประเภทอโลหะ**: ใช้ผงคาร์บอน/กราไฟต์อัดแท่ง มีขนาดเล็ก แต่ค่าคลาดเคลื่อนมากกว่าและทนกำลังไฟฟ้าได้น้อยกว่า\n\n**การแบ่งชนิดตามการใช้งาน**\n1. **ชนิดค่าคงที่ (Fixed)** เช่น คาร์บอนรีซีสเตอร์, ฟิล์มคาร์บอน (10Ω–25MΩ), ฟิล์มโลหะ (10Ω–30MΩ, ทนกำลังถึง 10W, คลาดเคลื่อน 0.1–2%), ไวร์วาวด์ (0.1Ω–800kΩ, ทนกำลังถึง 15W, คลาดเคลื่อน 0.01–1%)\n2. **ชนิดเปลี่ยนค่าได้ (Variable)** ใช้แกนหมุนหรือเลื่อน แบ่งการใช้งานเป็น **รีโอสตัท (Rheostat)** ต่ออนุกรมกับโหลดเพื่อควบคุมกระแส และ **โพเทนชิโอมิเตอร์ (Potentiometer/Pot)** ใช้แบ่งแรงดัน (voltage divider) มี 2 ชนิด คือ แบบ A (ปรับค่าแบบไม่เป็นเชิงเส้น/ล็อกสเกล ใช้ทำวอลลุ่ม) และแบบ B (ปรับค่าเชิงเส้น ใช้ทำเบส/ทรีเบิล/ความสว่างจอ)\n3. **ชนิดปรับแต่งค่าได้ (Adjustable)** ปรับตำแหน่งปลอกโลหะบนขดลวดแล้วล็อกไว้\n4. **ชนิดแบ่งค่าได้ (Tapped)** แท็ปขดลวดออกมาได้หลายค่า\n5. **ชนิดพิเศษ**: **เทอร์มิสเตอร์ (Thermistor)** ความต้านทานเปลี่ยนตามอุณหภูมิ แบ่งเป็น NTC (อุณหภูมิเพิ่ม ความต้านทานลด) และ PTC (อุณหภูมิเพิ่ม ความต้านทานเพิ่ม); **LDR (Light Dependent Resistor)** ความต้านทานเปลี่ยนตามแสง (ทำจากสารกึ่งตัวนำ เช่น CdS, CdSe)\n\n**การอ่านค่าความต้านทานด้วยรหัสสี** — แบบ 4 แถบสี: แถบ 1-2 = ตัวเลขหลักที่ 1-2, แถบ 3 = ตัวคูณ, แถบ 4 = ค่าคลาดเคลื่อน (ทอง=5%, เงิน=10%, แดง=2%, น้ำตาล=1%) รหัสสี: ดำ=0, น้ำตาล=1, แดง=2, ส้ม=3, เหลือง=4, เขียว=5, น้ำเงิน=6, ม่วง=7, เทา=8, ขาว=9 เช่น น้ำตาล-ดำ-แดง-ทอง = 10×10² = 1,000Ω ±5% แบบ 5 แถบสี ใช้กับตัวต้านทานความแม่นยำสูง โดยแถบ 1-3 = ตัวเลข, แถบ 4 = ตัวคูณ, แถบ 5 = ค่าคลาดเคลื่อน\n\n## ไฟฟ้ากระแสสลับ (AC)\n\n**ไฟฟ้ากระแสสลับ** คือไฟฟ้าที่ทิศทางและขนาดของกระแส/แรงดันเปลี่ยนแปลงตลอดเวลาเป็นรูปคลื่นซายน์ สร้างจากเครื่องกำเนิดไฟฟ้าโดยใช้หลักการเหนี่ยวนำแม่เหล็กไฟฟ้า สมการพื้นฐาน:\n\n**e = E_max sin θ** (แรงดัน), **i = I_max sin θ** (กระแส) หรือเขียนเป็น **v = V_max sin(ωt)**\n\n**คำศัพท์สำคัญ**\n- **ไซเคิล (Cycle)**: การเคลื่อนที่ครบหนึ่งรอบของคลื่น\n- **คาบเวลา (T)**: เวลาที่คลื่นเคลื่อนที่ครบ 1 รอบ\n- **ความถี่ (f)**: จำนวนไซเคิลใน 1 วินาที หน่วยเฮิรตซ์ (Hz) โดย **T = 1/f** หรือ **f = 1/T** (ไฟฟ้าในบ้านไทยใช้ f = 50 Hz)\n- **ความเร็วเชิงมุม (ω)**: **ω = 2πf**\n- **ความยาวคลื่น (λ)**: v = fλ\n\n**ค่า RMS (Root Mean Square)** เนื่องจากค่าเฉลี่ยของ AC เป็นศูนย์ จึงใช้ค่า RMS แทนค่ากระแส/แรงดันที่ให้ผลเทียบเท่า DC โดย V_max = √2 × V_rms (เช่นไฟบ้าน 220V คือค่า RMS, V_max ≈ 311V) และ P_avg = I_rms²R = V_rms²/R\n\n**อุปกรณ์ในวงจร AC**\n- **ตัวต้านทาน (R)**: กระแสและแรงดันมีเฟสตรงกัน (in phase)\n- **ตัวเหนี่ยวนำ (Inductor, L)** หน่วยเฮนรี (H): มีค่า **inductive reactance, X_L = ωL** แรงดันนำหน้ากระแส 90° (กระแสตามหลังแรงดัน 90°)\n- **ตัวเก็บประจุ (Capacitor, C)** หน่วยฟารัด (F): มีค่า **capacitive reactance, X_C = 1/(ωC)** กระแสนำหน้าแรงดัน 90° (แรงดันล้าหลังกระแส 90°)\n\n**อิมพีแดนซ์ (Impedance, Z)** คือความต้านทานรวมของวงจร AC ที่มี R, L, C มีหน่วยเป็นโอห์ม นิยาม **Z = V/I**\n\n**วงจรอนุกรม RC**: กระแสมีเฟสนำแรงดันตกคร่อม C อยู่ 90° เสมอ, แรงดันตกคร่อม R มีเฟสตรงกับกระแส, เวกเตอร์ผลรวมของ V_R และ V_C เท่ากับ V รวม\n\n**วงจรอนุกรม RLC**: Z = √(R² + (X_L - X_C)²), I = V/Z, มุมเฟสวงจร φ หา power factor ได้จาก **PF = cos φ = R/Z**\n\n**เรโซแนนซ์ (Resonance)** เกิดเมื่อ X_L = X_C ที่ความถี่เรโซแนนซ์:\n\n**f₀ = 1/(2π√LC)**\n\n- **เรโซแนนซ์แบบอนุกรม**: Z มีค่าต่ำสุดเท่ากับ R, กระแสในวงจรสูงสุด, แรงดันตกคร่อม R สูงสุด\n- **เรโซแนนซ์แบบขนาน**: Z มีค่าสูงสุด (เข้าใกล้อนันต์), กระแสในวงจรต่ำสุด (เข้าใกล้ศูนย์), แรงดันตกคร่อม R ต่ำสุด\n\nหลักการเรโซแนนซ์นี้นำไปใช้ในวงจรจูนความถี่ (Tuning) เช่น วงจรรับสัญญาณวิทยุ\n\n## สารกึ่งตัวนำและไดโอด (ความรู้เสริม)\n\n**สารกึ่งตัวนำ (Semiconductor)** เช่น ซิลิกอน เจอร์เมเนียม มีสมบัติระหว่างตัวนำกับฉนวน แบ่งเป็นสารกึ่งตัวนำแท้ (intrinsic) และสารกึ่งตัวนำไม่บริสุทธิ์ (extrinsic) ซึ่งเกิดจากการเจือสารเพิ่ม (doping) แบ่งเป็น\n- **ชนิด N (N-type)**: เจือธาตุกลุ่ม 5 (เช่น พลวง, ฟอสฟอรัส) เรียกว่า \"ตัวให้\" (donor) ทำให้มีอิเล็กตรอนอิสระส่วนเกิน\n- **ชนิด P (P-type)**: เจือธาตุกลุ่ม 3 (เช่น โบรอน) เรียกว่า \"ตัวรับ\" (acceptor) ทำให้เกิดโฮล (hole) ส่วนเกิน\n\nเมื่อนำสาร P และ N มาต่อกันเกิด **รอยต่อ PN (PN Junction)** ซึ่งเป็นพื้นฐานของ **ไดโอด (Diode)** อุปกรณ์ที่ยอมให้กระแสไหลทางเดียวเท่านั้น เมื่อ**ไบอัสตรง (Forward Bias)** กระแสไหลผ่านได้ เมื่อ**ไบอัสย้อน (Reverse Bias)** กระแสแทบไม่ไหล การประยุกต์ใช้ไดโอดที่สำคัญคือ **วงจรเรียงกระแส (Rectifier)** ทั้งแบบครึ่งคลื่นและเต็มคลื่น สำหรับแปลงไฟ AC เป็น DC นอกจากนี้ยังมี **ซีเนอร์ไดโอด (Zener Diode)** ใช้รักษาระดับแรงดันให้คงที่โดยอาศัยช่วงพังทลาย (breakdown) เมื่อไบอัสย้อน และ **LED (Light Emitting Diode)** ที่เปล่งแสงเมื่อไบอัสตรง"}, {"id": "english", "title": "ไวยากรณ์ภาษาอังกฤษ", "icon": "🇬🇧", "body": "# สรุปไวยากรณ์ภาษาอังกฤษ (English Grammar Summary) สำหรับเตรียมสอบ\n\nเอกสารนี้รวบรวมและสรุปเนื้อหาไวยากรณ์ภาษาอังกฤษที่สำคัญ โดยเน้น **Tense ทั้ง 12** โครงสร้าง หลักการใช้ Preposition, Quantifier และ If-Clause พร้อมตัวอย่างประโยคเพื่อใช้ทบทวนก่อนสอบ\n\n## ความรู้พื้นฐานเรื่อง Tense\n\nTense คือรูปแบบของกริยาที่บอกว่าการกระทำหรือเหตุการณ์นั้นเกิดขึ้นเมื่อใด ภาษาอังกฤษไม่มีคำบอกเวลาแยกต่างหากเหมือนภาษาไทย แต่จะฝังไว้ในรูปกริยาโดยตรง จึงต้องเข้าใจ Tense ให้แม่นยำ\n\nTense แบ่งเป็น 3 กลุ่มใหญ่ ได้แก่ **Present (ปัจจุบัน) / Past (อดีต) / Future (อนาคต)** และแต่ละกลุ่มแยกย่อยเป็น 4 แบบ คือ **Simple (ธรรมดา) / Continuous (กำลังกระทำ) / Perfect (สมบูรณ์) / Perfect Continuous (สมบูรณ์กำลังกระทำ)** รวมทั้งหมด 12 Tense\n\n## โครงสร้าง Tense ต่างๆ (สรุปโครงสร้างทั้ง 12)\n\n**กลุ่ม Present**\n- Present Simple: `S. + V.1 (s/es)`\n- Present Continuous: `S. + is/am/are + V.ing`\n- Present Perfect: `S. + has/have + V.3`\n- Present Perfect Continuous: `S. + has/have + been + V.ing`\n\n**กลุ่ม Past**\n- Past Simple: `S. + V.2`\n- Past Continuous: `S. + was/were + V.ing`\n- Past Perfect: `S. + had + V.3`\n- Past Perfect Continuous: `S. + had + been + V.ing`\n\n**กลุ่ม Future**\n- Future Simple: `S. + will/shall + V.1`\n- Future Continuous: `S. + will/shall + be + V.ing`\n- Future Perfect: `S. + will/shall + have + V.3`\n- Future Perfect Continuous: `S. + will/shall + have + been + V.ing`\n\n## หลักการใช้ Present Tenses\n\n**Present Simple** ใช้กับ 1) เหตุการณ์ที่เกิดเป็นประจำ (มักมีคำบอกความถี่ เช่น always, usually, often, sometimes, hardly, never) 2) ความจริงตามธรรมชาติหรือสุภาษิต 3) ตารางเวลา/แผนการที่แน่นอน 4) กริยาที่แสดงความรู้สึกหรือสภาวะ (state verbs) เช่น love, understand, know ซึ่งทำต่อเนื่องไม่ได้ 5) เล่าเรื่องสรุปในอดีต (นิยาย นิทาน) 6) ประโยคเงื่อนไขในอนาคต (if, unless, as soon as, till, whenever, while)\n- ตัวอย่าง: *Jack often comes to work late.* / *Water boils at 100 degree Celsius.* / *The concert begins at 8 p.m.*\n\n**Present Continuous** ใช้กับเหตุการณ์ที่กำลังเกิดขึ้นขณะพูด (now, right now, at the moment), เหตุการณ์ที่กำลังดำเนินในช่วงเวลายาว (ไม่จำเป็นต้องเกิดขณะพูด) และแผนอนาคตอันใกล้ที่มั่นใจว่าจะเกิดขึ้นแน่นอน **หมายเหตุ: ห้ามใช้กับ state verbs**\n- ตัวอย่าง: *They are watching TV now.* / *My friend is coming tonight.* / *They are leaving for England tomorrow.*\n\n**Present Perfect** ใช้กับ 1) เหตุการณ์ที่เพิ่งจบลง (just, yet, already, finally, recently) 2) เหตุการณ์ในอดีตที่ไม่ระบุเวลาแน่ชัด (ever, never, once, twice) 3) เหตุการณ์ที่เริ่มในอดีตและต่อเนื่องถึงปัจจุบัน (since, for, so far, up to now) 4) เหตุการณ์ที่เกิดซ้ำหลายครั้งในอดีต\n- ตัวอย่าง: *The kids have just finished reading the book.* / *Have you ever been to Paris?* / *She has studied Japanese for five years.*\n\n**Present Perfect Continuous** ใช้เหมือน Present Perfect แต่เน้นความต่อเนื่องของการกระทำ และมีแนวโน้มจะดำเนินต่อไปในอนาคต\n- ตัวอย่าง: *Jim has been waiting for Tom for two hours.* / *He has been repairing this house for four years.*\n\n## หลักการใช้ Past Tenses\n\n**Past Simple** ใช้กับเหตุการณ์ที่จบไปแล้วในอดีต (yesterday, last night/week, …ago, in 2015) และเหตุการณ์ที่เคยเกิดเป็นประจำในอดีตแต่ปัจจุบันไม่ทำแล้ว (ต้องมีทั้งคำบอกความถี่และคำบอกเวลาในอดีตร่วมกัน)\n- ตัวอย่าง: *When I was five, my father gave me a bicycle.* / *He bought a new car last month, but he doesn't really like it.*\n\n**Past Continuous** ใช้กับเหตุการณ์ที่กำลังเกิด ณ จุดใดจุดหนึ่งในอดีต หรือใช้คู่กับ Past Simple เพื่อแสดงว่ามีเหตุการณ์หนึ่งกำลังดำเนินอยู่ (Past Cont.) แล้วมีอีกเหตุการณ์หนึ่งแทรกเข้ามา (Past Simple) โดยมักใช้ when, while, as เชื่อมประโยค นอกจากนี้ยังใช้กับสองเหตุการณ์ที่เกิดพร้อมกันในอดีต (Past Cont. ทั้งคู่)\n- ตัวอย่าง: *I was washing the dishes when the phone rang.* / *While he was watching TV, she was reading.*\n\n**Past Perfect** ใช้กับเหตุการณ์ที่จบลงก่อนอีกเหตุการณ์หนึ่งในอดีต (มักมี before, after, when, by…, by the time) โดย **เหตุการณ์ที่เกิดก่อนใช้ Past Perfect และเหตุการณ์ที่เกิดทีหลังใช้ Past Simple**\n- ตัวอย่าง: *They had locked all the doors before they left.* / *He had written five letters to the manager by the time he finally received an answer.*\n\n**Past Perfect Continuous** ใช้เหมือน Past Perfect แต่เน้นความต่อเนื่องของการกระทำที่ 1 จนถึงการกระทำที่ 2\n- ตัวอย่าง: *When I found her, she had been crying for hours.*\n\n**สรุปสูตรจำง่าย**: เกิดก่อน → Past Perfect / Past Perfect Continuous, เกิดทีหลัง → Past Simple\n\n## หลักการใช้ Future Tenses\n\n**Future Simple** ใช้ `will/shall + V.1` กับเหตุการณ์ในอนาคต (soon, tomorrow, later, next week/month/year) หรือการตัดสินใจกะทันหันขณะพูด ส่วน `is/am/are going to` ใช้แทน will เมื่อมีการวางแผนล่วงหน้าและมั่นใจว่าจะเกิดขึ้น (แน่นอนกว่า will) นอกจากนี้ **Shall ใช้กับ I/we, Will ใช้กับบุรุษที่ 2 และคำนามทั่วไป** ส่วน will/shall สลับใช้ได้เมื่อให้คำมั่นสัญญา ข่มขู่ หรือตัดสินใจแน่วแน่ ส่วน be going to ใช้กับความจงใจของมนุษย์เท่านั้น ห้ามใช้กับเหตุการณ์ธรรมชาติ\n- ตัวอย่าง: *Please wait here. She will return in ten minutes.* / *I am going to meet my friends tonight.*\n\n**Future Continuous** ใช้กับเหตุการณ์ที่กำลังดำเนินอยู่ ณ จุดหนึ่งในอนาคต หรือเหตุการณ์ที่คาดว่าจะเกิดแต่ไม่แน่ใจ\n- ตัวอย่าง: *At 9 o'clock tomorrow, I will be travelling to Japan.* / *A storm will be coming soon.*\n\n**Future Perfect** ใช้กับเหตุการณ์ที่คาดว่าจะสิ้นสุดในเวลาที่กำหนดไว้ในอนาคต (มี by, before, after, when, by the time, as soon as, once, until) โดยเหตุการณ์ที่เกิดทีหลังใช้ Present Simple\n- ตัวอย่าง: *I will have finished the work before the deadline.* / *When he gets there, the film will have started.*\n\n**Future Perfect Continuous** ใช้เหมือน Future Perfect แต่เน้นความต่อเนื่องของการกระทำ\n- ตัวอย่าง: *They will have been sleeping for three hours by the time their parents get home.*\n\n## กฎไวยากรณ์สำคัญ: Preposition บอกเวลาและสถานที่\n\n**บอกเวลา**\n- `in` + ฤดู/ปี/ช่วงเวลา เช่น *in summer, in 2015, in the evening*\n- `on` + วันในสัปดาห์/วันที่ เช่น *on Monday, on June 14*\n- `at` + เวลา เช่น *at night, at 10 o'clock*\n- `by` + จุดกำหนดเวลา เช่น *by next week, by tomorrow*\n- `since` + จุดเริ่มต้นของเวลา เช่น *since 2010* / `for` + ระยะเวลา เช่น *for ten minutes*\n- `during` + ระยะเวลาต่อเนื่อง เช่น *during the war* / `from…to/until` เช่น *from 2010 to 2014*\n\n**บอกสถานที่**\n- `at` = ตำแหน่งเจาะจง เช่น *at the door, at the airport*\n- `on` = ถนน/ชั้นอาคาร เช่น *on the 3rd floor, on the wall*\n- `in` = เมือง/ประเทศ/ทวีป เช่น *in Thailand, in Asia*\n- `between` = ระหว่างคน/สิ่งของสองสิ่ง เช่น *between John and Peter*\n\n**บอกทิศทาง**: into (เข้าไปข้างใน), toward (ไปทาง), through (ผ่าน), across (ข้าม), around (รอบๆ)\n\n**บอกการกระทำ**: `by` + พาหนะ (*by bus*), `on foot` (เดินเท้า), `with` + อุปกรณ์ (*with a pen*), `like` = เหมือนกัน (*looks like her mother*), `as` = ตำแหน่ง/หน้าที่ (*works as a teacher*)\n\n## กฎไวยากรณ์สำคัญ: Quantifier (คำบอกปริมาณ)\n\n- **many** ใช้กับนามนับได้พหูพจน์ (*many books*) / **much** ใช้กับนามนับไม่ได้ (*much water, much money*)\n- **few** = น้อย (นับได้) เช่น *few students* / **little** = น้อย (นับไม่ได้) เช่น *little salt, little money*\n- **some** ใช้ในประโยคบอกเล่า หรือประโยคคำถามเชิงขอร้อง/เสนอที่คาดว่าคำตอบเป็น \"Yes\" เช่น *Would you like some coffee?*\n- **any** ใช้ในประโยคคำถามทั่วไปหรือปฏิเสธ เช่น *I do not have any pencils.* / *Do you have any pens?*\n- **both (of)** + นามนับได้พหูพจน์ เช่น *Both brothers work with their father.*\n- **either** + นามนับได้เอกพจน์ (อย่างใดอย่างหนึ่งในสอง) เช่น *There are shops at either end of the street.*\n- **neither** + นามนับได้เอกพจน์ (ไม่ทั้งสองอย่าง) เช่น *Neither company could succeed on its own.*\n\n## กฎไวยากรณ์สำคัญ: If-Clause (ประโยคเงื่อนไข)\n\n**เงื่อนไขที่ 1 (Real Condition)** – ความจริงหรือเหตุการณ์ที่มีโอกาสเกิดขึ้นได้จริง มี 3 รูปแบบ\n- `If + S. + Present Simple, S. + will + V.1` เช่น *If the weather is fine, we will go to the beach.*\n- `If + S. + Present Simple, S. + Present Simple` (ความจริงทั่วไป) เช่น *If water boils, it changes into steam.*\n- `If + S. + Present Simple, Imperative (V.1)` (คำสั่ง/ขอร้อง) เช่น *If your father comes, tell him the truth.*\n\n**เงื่อนไขที่ 2 (Unreal Present)** – ตรงข้ามกับความจริงในปัจจุบัน\n- `If + S. + Past Simple, S. + would/should/could/might + V.1` เช่น *If I knew her name, I would tell you.* / *If she were a bird, she would fly around world.* (สังเกต: ใช้ *were* กับทุกประธานในประโยคสมมติ)\n\n**เงื่อนไขที่ 3 (Unreal Past)** – ตรงข้ามกับความจริงในอดีต\n- `If + S. + Past Perfect (had + V.3), S. + would/should/could/might + have + V.3` เช่น *If I had known the answer, I would have told you.*\n\n## ข้อสังเกตและเทคนิคจำสำหรับข้อสอบ\n\n1. **State verbs** (love, understand, know, like) ห้ามใช้รูป Continuous เด็ดขาด แม้แต่ใน Future Perfect Continuous\n2. คำบ่งชี้ Tense เป็นตัวช่วยสำคัญ: since/for → Perfect, now/at the moment → Continuous, yesterday/ago → Past Simple, tomorrow/next → Future\n3. เมื่อมี **สองเหตุการณ์ในอดีต**: เหตุการณ์ที่เกิดก่อนใช้ Past Perfect เสมอ เหตุการณ์ที่เกิดทีหลังใช้ Past Simple\n4. เมื่อมี **สองเหตุการณ์ในอนาคต** ที่เชื่อมด้วย when/before/after/by the time: เหตุการณ์หลัง if/when มักใช้ Present Simple แทน Future แม้ความหมายเป็นอนาคต\n5. If-Clause เงื่อนไขที่ 2 ใช้ Past Simple แต่ความหมายเป็นปัจจุบัน ไม่ใช่อดีต — เป็นจุดที่ผู้สอบสับสนบ่อย\n6. ฝึกทำแบบฝึกหัด Dialogue Completion เพื่อฝึกจับใจความบทสนทนาและเลือกคำตอบที่สอดคล้องกับน้ำเสียงและเนื้อหาก่อน-หลัง เช่น ตัวอย่างจากเอกสาร: *Doctor: Take this medicine… Patient: But I've used it before and it did not help at all.*\n\n## ตัวอย่างประโยคเปรียบเทียบ Tense ที่ใช้บ่อยในข้อสอบ\n\n| Tense | ตัวอย่าง | ความหมาย |\n|---|---|---|\n| Present Simple | He walks. | เขาเดิน (เป็นปกติ) |\n| Present Continuous | He is walking. | เขากำลังเดิน |\n| Present Perfect | He has walked. | เขาได้เดินแล้ว (ถึงปัจจุบัน) |\n| Present Perfect Continuous | He has been walking. | เขาได้กำลังเดินมาต่อเนื่อง |\n| Past Simple | He walked. | เขาเดินแล้ว (จบในอดีต) |\n| Past Continuous | He was walking. | เขากำลังเดินอยู่ (ในอดีต) |\n| Past Perfect | He had walked. | เขาได้เดินไปแล้ว (ก่อนอีกเหตุการณ์) |\n| Past Perfect Continuous | He had been walking. | เขาได้เดินต่อเนื่องมา (ก่อนอีกเหตุการณ์) |\n| Future Simple | He will walk. | เขาจะเดิน |\n| Future Continuous | He will be walking. | เขาจะกำลังเดินอยู่ |\n| Future Perfect | He will have walked. | เขาจะได้เดินสำเร็จแล้ว |\n| Future Perfect Continuous | He will have been walking. | เขาจะได้เดินต่อเนื่องมาถึงจุดนั้น |\n\nควรฝึกแต่งประโยคของแต่ละ Tense ด้วยตนเอง สังเกตคำสัญญาณ (signal words) ที่มากับแต่ละ Tense และฝึกทำโจทย์ If-Clause กับ Preposition ควบคู่กัน เพราะเป็นหัวข้อที่ออกสอบบ่อยและเชื่อมโยงกับความเข้าใจ Tense โดยตรง"}, {"id": "trig", "title": "ตรีโกณมิติและจำนวนเชิงซ้อน", "icon": "📐", "body": "## สรุปเนื้อหาเตรียมสอบ: ฟังก์ชันตรีโกณมิติ และ จำนวนเชิงซ้อน\n\n---\n\n## ส่วนที่ 1: ฟังก์ชันตรีโกณมิติ (Trigonometric Functions)\n\n### 1.1 วงกลมหนึ่งหน่วยและนิยามพื้นฐาน\n\nวงกลมหนึ่งหน่วย คือวงกลมรัศมี 1 หน่วย จุดศูนย์กลางที่ (0, 0) นั่นคือ x² + y² = 1\n\nถ้า θ เป็นความยาวส่วนโค้ง (วัดทวนเข็มนาฬิกาเมื่อ θ > 0 และตามเข็มนาฬิกาเมื่อ θ < 0) จากจุด (1, 0) ไปยังจุด (x, y) บนวงกลม จะนิยาม\n\n- **sin θ = y**\n- **cos θ = x**\n\nจากสมการวงกลมจึงได้เอกลักษณ์พื้นฐานที่สุด:\n\n**sin²θ + cos²θ = 1**\n\nและเนื่องจาก –1 ≤ x, y ≤ 1 จึงได้ –1 ≤ sin θ ≤ 1 และ –1 ≤ cos θ ≤ 1 เสมอ\n\n**ค่าที่ต้องจำ (มุมพิเศษ):**\n\n| θ | 0 | π/6 | π/4 | π/3 | π/2 |\n|---|---|---|---|---|---|\n| sin θ | 0 | 1/2 | √2/2 | √3/2 | 1 |\n| cos θ | 1 | √3/2 | √2/2 | 1/2 | 0 |\n\n**ฟังก์ชันตรีโกณมิติอื่น ๆ** (นิยามจาก sin, cos):\n\n- tan θ = sin θ / cos θ (เมื่อ cos θ ≠ 0)\n- cot θ = cos θ / sin θ (เมื่อ sin θ ≠ 0)\n- sec θ = 1 / cos θ\n- cosec θ = 1 / sin θ\n\n**เอกลักษณ์พีทาโกรัสที่แตกแขนงมา** (หาร sin²θ+cos²θ=1 ด้วย sin²θ หรือ cos²θ):\n\n- **1 + cot²θ = cosec²θ**\n- **tan²θ + 1 = sec²θ**\n\n**ฟังก์ชันคู่/คี่:** sin(–θ) = –sin θ, cos(–θ) = cos θ, tan(–θ) = –tan θ (cos เป็นฟังก์ชันคู่ ที่เหลือเป็นฟังก์ชันคี่)\n\n**การลดรูปมุมที่จุดปลายอยู่บนแกน**: ใช้กฎ \"แกนนอน ± θ = ± ฟังก์ชันเดิม θ\" และ \"แกนตั้ง ± θ = ± โคฟังก์ชัน θ\" โดยเครื่องหมายดูจากจตุภาคเดิม เช่น sin(π – θ) = sin θ, cos(π/2 + θ) = –sin θ\n\n### 1.2 มุมและอัตราส่วนในสามเหลี่ยมมุมฉาก\n\nการแปลงหน่วย: **2π เรเดียน = 360°** ดังนั้น มุม(เรเดียน) = มุม(องศา) × π/180 และ มุม(องศา) = มุม(เรเดียน) × 180/π\n\nในสามเหลี่ยมมุมฉาก มุม C: sin C = ตรงข้าม/ด้านตรงข้ามมุมฉาก, cos C = ประชิด/ด้านตรงข้ามมุมฉาก, tan C = ตรงข้าม/ประชิด (และ cot, sec, cosec เป็นส่วนกลับตามลำดับ)\n\n### 1.3 สูตรผลบวก–ผลต่างของมุม (Sum and Difference Formulas)\n\n- sin(A ± B) = sin A cos B ± cos A sin B\n- cos(A + B) = cos A cos B – sin A sin B\n- cos(A – B) = cos A cos B + sin A sin B\n- tan(A ± B) = (tan A ± tan B) / (1 ∓ tan A tan B)\n\n### 1.4 มุมสองเท่า สามเท่า และครึ่งมุม\n\n**มุมสองเท่า:**\n- sin 2A = 2 sin A cos A\n- cos 2A = cos²A – sin²A = 2cos²A – 1 = 1 – 2sin²A\n- tan 2A = 2tan A / (1 – tan²A)\n\n**ครึ่งมุม:**\n- sin(A/2) = ±√[(1 – cos A)/2]\n- cos(A/2) = ±√[(1 + cos A)/2]\n- tan(A/2) = (1 – cos A)/sin A\n\n**มุมสามเท่า:**\n- sin 3A = 3 sin A – 4 sin³A\n- cos 3A = 4 cos³A – 3 cos A\n\n### 1.5 ผลคูณ ↔ ผลบวก/ผลต่างของฟังก์ชัน\n\n- 2 sin A cos B = sin(A+B) + sin(A–B)\n- 2 cos A cos B = cos(A+B) + cos(A–B)\n- 2 sin A sin B = cos(A–B) – cos(A+B)\n- sin A + sin B = 2 sin[(A+B)/2] cos[(A–B)/2]\n- cos A + cos B = 2 cos[(A+B)/2] cos[(A–B)/2]\n\n### 1.6 อินเวอร์สฟังก์ชันตรีโกณมิติ\n\nโดเมนถูกจำกัดให้เป็นฟังก์ชันหนึ่งต่อหนึ่ง เช่น arcsin: [–1,1] → [–π/2, π/2], arccos: [–1,1] → [0, π], arctan: R → (–π/2, π/2)\n\nความสัมพันธ์สำคัญ: **arcsin x + arccos x = π/2**, **arctan x + arccot x = π/2**\n\n### 1.7 สมการตรีโกณมิติ (คำตอบทั่วไป)\n\n- ถ้า sin x = sin θ: x = nπ + (–1)ⁿθ\n- ถ้า cos x = cos θ: x = 2nπ ± θ\n- ถ้า tan x = tan θ: x = nπ + θ (n ∈ I)\n\n### 1.8 กฎของไซน์และโคไซน์ (การแก้สามเหลี่ยม)\n\n**กฎของโคไซน์:** a² = b² + c² – 2bc cos A (ใช้เมื่อรู้ 2 ด้านกับมุมระหว่างด้าน หรือรู้ 3 ด้าน)\n\n**กฎของไซน์:** sin A / a = sin B / b = sin C / c (ใช้เมื่อรู้ด้าน–มุมตรงข้ามคู่หนึ่ง)\n\n### ตัวอย่างโจทย์ที่แก้สมบูรณ์\n\n**ตัวอย่าง 1:** ถ้า sin θ – cos θ = a จงหา sin θ cos θ\n\nยกกำลังสองสองข้าง: (sin θ – cos θ)² = a² → sin²θ – 2 sin θ cos θ + cos²θ = a² → 1 – 2 sin θ cos θ = a²\nดังนั้น **sin θ cos θ = (1 – a²)/2**\n\n**ตัวอย่าง 2:** จงหา tan(11π/12)\n\n11π/12 = π – π/12 → tan(π – θ) = –tan θ ดังนั้น tan(11π/12) = –tan(π/12) และ π/12 = π/3 – π/4\nใช้สูตรผลต่าง: tan(π/3 – π/4) = (√3 – 1)/(1 + √3) หลังจัดรูปจะได้ tan(11π/12) = (1–√3)/(1+√3) (คูณ conjugate ปรับให้อยู่ในรูปตัวเลือกมาตรฐาน)\n\n**ตัวอย่าง 3:** สามเหลี่ยม ABC มี BAC = 45°, ACB = 60°, ด้าน AC = 20 นิ้ว จงหาพื้นที่\n\nมุม B = 180 – 45 – 60 = 75° ใช้กฎไซน์หา AB: AB/sin C = AC/sin B → AB = 20 sin 60°/sin 75°\nพื้นที่ = (1/2)·AC·AB·sin A แทนค่าและจัดรูป (ใช้ sin 75° = sin(45°+30°) = (√6+√2)/4) จะได้พื้นที่ = 100(3+√3) ตารางหน่วย (ประมาณ)\n\n**ตัวอย่าง 4:** แก้สมการ 2cos θ + 1 = sec θ เมื่อ 0 ≤ θ ≤ π\n\nคูณทั้งสองข้างด้วย cos θ: 2cos²θ + cos θ – 1 = 0 → (2cos θ – 1)(cos θ + 1) = 0\ncos θ = 1/2 → θ = π/3 หรือ cos θ = –1 → θ = π\nผลบวกคำตอบ = π/3 + π = **4π/3**\n\n**ตัวอย่าง 5:** นายดำมองยอดเสาธงมุมเงย 60° เดินเข้าไปอีก 20 เมตร เห็นมุมเงย 75° จงหาระยะเดิมจากเสา\n\nให้ h = ความสูงเสา, x = ระยะเดิม: tan60° = h/x และ tan75° = h/(x–20)\nh = x tan60° = (x–20)tan75° → x(tan75° – tan60°) = 20 tan75°\nแก้สมการโดยแทนค่า tan75° = 2+√3 จะได้ x = 10(2 + 2√3) เมตร\n\n---\n\n## ส่วนที่ 2: จำนวนเชิงซ้อน (Complex Numbers)\n\n### 2.1 นิยามพื้นฐาน\n\nจำนวนเชิงซ้อนเกิดจากความต้องการแก้สมการ เช่น x² + 1 = 0 ที่ไม่มีคำตอบเป็นจำนวนจริง\n\n**นิยาม:** จำนวนเชิงซ้อนคือจำนวนในรูป **Z = a + bi** เมื่อ a, b เป็นจำนวนจริง และ **i = √(–1)** (นั่นคือ i² = –1)\n- a เรียกว่าส่วนจริง (real part)\n- b เรียกว่าส่วนจินตภาพ (imaginary part)\n\n**ความเท่ากัน:** Z₁ = a+bi เท่ากับ Z₂ = c+di ก็ต่อเมื่อ a = c และ b = d\n\n### 2.2 การดำเนินการพื้นฐาน\n\nกำหนด Z₁ = a+bi, Z₂ = c+di:\n\n1. **บวก:** Z₁ + Z₂ = (a+c) + (b+d)i\n2. **ลบ:** Z₁ – Z₂ = (a–c) + (b–d)i\n3. **คูณ:** Z₁·Z₂ = (ac–bd) + (ad+bc)i\n4. **หาร:** Z₁/Z₂ = [(ac+bd) + (bc–ad)i] / (c²+d²)\n\nสมบัติ: การบวกและการคูณมีสมบัติการสลับที่ การเปลี่ยนหมู่ และการแจกแจง เช่นเดียวกับจำนวนจริง\n\n### 2.3 สังยุค (Conjugate) และค่าสัมบูรณ์ (Modulus)\n\n**สังยุคของ Z = a+bi คือ Z̄ = a – bi**\n\nสมบัติสำคัญของสังยุค:\n- Z̄̄ = Z\n- Z₁ + Z₂ conjugate = Z̄₁ + Z̄₂\n- Z₁·Z₂ conjugate = Z̄₁ · Z̄₂\n- **Z · Z̄ = |Z|²** (ใช้บ่อยมากในการหาร)\n\n**ค่าสัมบูรณ์ (modulus):** |Z| = √(a² + b²)\n\nสมบัติของ modulus:\n- |Z₁·Z₂| = |Z₁|·|Z₂|\n- |Z₁/Z₂| = |Z₁|/|Z₂|\n- |Z₁+Z₂| ≤ |Z₁| + |Z₂| (อสมการสามเหลี่ยม)\n- |Z₁+Z₂|² = |Z₁|² + |Z₂|² + Z₁Z̄₂ + Z₂Z̄₁\n\n**อินเวอร์สการคูณ:** Z⁻¹ = (a – bi)/(a² + b²) = Z̄/|Z|²\n\n### 2.4 รูปเชิงขั้ว (Polar Form) และทฤษฎีเดอมัวร์\n\nเขียน Z = a+bi ในรูป **Z = r(cos θ + i sin θ)** เมื่อ\n- **r = |Z| = √(a² + b²)** (มอดุลัส)\n- **θ = arg(Z) = arctan(b/a)** ปรับตามจตุภาค (อาร์กิวเมนต์)\n\n**การคูณ/หารในรูปเชิงขั้ว:**\n- Z₁·Z₂ = r₁r₂[cos(θ₁+θ₂) + i sin(θ₁+θ₂)]\n- Z₁/Z₂ = (r₁/r₂)[cos(θ₁–θ₂) + i sin(θ₁–θ₂)]\n\n**ทฤษฎีเดอมัวร์ (De Moivre's Theorem):** ถ้า Z = r(cos θ + i sin θ) แล้ว\n**Zⁿ = rⁿ(cos nθ + i sin nθ)**  (กรณี r = 1 คือทฤษฎีเดอมัวร์ดั้งเดิม)\n\n**การถอดราก n:** ถ้า Z = r(cos θ + i sin θ) แล้วรากที่ n ของ Z มี n ค่า คือ\n**Z^(1/n) = ⁿ√r [cos((2kπ+θ)/n) + i sin((2kπ+θ)/n)]**, k = 0, 1, 2, ..., n–1\n\n### 2.5 สูตรออยเลอร์ (Euler's Formula)\n\nจากอนุกรมเทย์เลอร์ของ eˣ, sin x, cos x จะได้:\n\n**e^(iθ) = cos θ + i sin θ**\n\nกรณีพิเศษที่ θ = π: **e^(iπ) = –1** หรือเขียนเป็น **e^(iπ) + 1 = 0** (สมการที่รวม 5 ค่าคงที่สำคัญที่สุดของคณิตศาสตร์)\n\nจากสูตรนี้ยังพิสูจน์ได้ว่า e^(inθ) = (e^(iθ))ⁿ ซึ่งเทียบเท่าทฤษฎีเดอมัวร์\n\n### 2.6 สมการพหุนามกับจำนวนเชิงซ้อน\n\n**ทฤษฎีบทพื้นฐานของพีชคณิต:** สมการพหุนามดีกรี n (สัมประสิทธิ์เป็นจำนวนเชิงซ้อน) มีคำตอบเชิงซ้อนทั้งหมด n คำตอบ (นับซ้ำ)\n\n**ทฤษฎีบทรากคู่สังยุค:** ถ้าสมการพหุนามมีสัมประสิทธิ์เป็นจำนวนจริงทั้งหมด และ a+bi (b≠0) เป็นคำตอบ แล้ว a–bi ก็เป็นคำตอบด้วย (รากเชิงซ้อนเกิดเป็นคู่สังยุคเสมอ)\n\n**ความสัมพันธ์ระหว่างราก–สัมประสิทธิ์ (Vieta's Formulas):**\n\nสำหรับ a₂x² + a₁x + a₀ = 0 ที่มีราก α₁, α₂:\n- ผลบวกราก: α₁ + α₂ = –a₁/a₂\n- ผลคูณราก: α₁α₂ = a₀/a₂\n\nสำหรับ a₃x³ + a₂x² + a₁x + a₀ = 0 ที่มีราก α₁, α₂, α₃:\n- α₁+α₂+α₃ = –a₂/a₃\n- α₁α₂+α₂α₃+α₁α₃ = a₁/a₃\n- α₁α₂α₃ = –a₀/a₃\n\n### ตัวอย่างโจทย์ที่แก้สมบูรณ์\n\n**ตัวอย่าง 1:** กำหนด Z₁ = 2–i, Z₂ = 3+2i จงหา Z₁·Z₂ และ Z₁/Z₂\n\nZ₁·Z₂ = (2)(3) – (–1)(2) + [(2)(2)+(–1)(3)]i = 6+2 + (4–3)i = **8 + i**\n\nZ₁/Z₂ = [(2)(3)+(–1)(2)]/(3²+2²) + [(–1)(3)–(2)(2)]/13 · i = 4/13 – 7/13 i\n\n**ตัวอย่าง 2:** กำหนด Z = 3–4i จงหา |Z| และ Z⁻¹\n\n|Z| = √(9+16) = √25 = **5**\n\nZ⁻¹ = Z̄/|Z|² = (3+4i)/25 = **3/25 + 4/25 i**\n\n**ตัวอย่าง 3:** เขียน Z = –1+i ในรูปเชิงขั้วและรูปเอกซ์โพเนนเชียล\n\nr = √((–1)²+1²) = √2, θ = arctan(1/–1) อยู่จตุภาค 2 → θ = 3π/4\n\n**Z = √2(cos 3π/4 + i sin 3π/4) = √2 e^(i·3π/4)**\n\n**ตัวอย่าง 4:** กำหนด Z = √3 + i จงหา Z⁶\n\nr = √(3+1) = 2, θ = arctan(1/√3) = π/6\n\nใช้เดอมัวร์: Z⁶ = 2⁶[cos(6·π/6) + i sin(6·π/6)] = 64[cos π + i sin π] = 64(–1+0i) = **–64**\n\n**ตัวอย่าง 5:** จงแก้สมการ x² + x + 1 = 0 และหารากทั้งหมด\n\nจากสูตร x = [–b ± √(b²–4ac)]/2a เมื่อ a=b=c=1:\n\nx = [–1 ± √(1–4)]/2 = [–1 ± √(–3)]/2 = [–1 ± i√3]/2\n\nดังนั้น **x = –1/2 – (√3/2)i หรือ x = –1/2 + (√3/2)i** (คู่สังยุคกัน สอดคล้องกับทฤษฎีบทรากคู่สังยุค เพราะสัมประสิทธิ์เป็นจำนวนจริง)\n\n---\n\n## สรุปข้อควรจำก่อนสอบ\n\n1. **ตรีโกณ**: จำค่ามุมพิเศษ (0, π/6, π/4, π/3, π/2) ให้แม่น เพราะใช้เป็นฐานในการแตกมุมทุกสูตร (ผลบวก/ผลต่าง/สองเท่า/ครึ่งมุม)\n2. เอกลักษณ์หลัก sin²+cos²=1, 1+cot²=cosec²θ, tan²+1=sec²θ ต้องแปลงสลับไปมาได้คล่อง\n3. โจทย์การแก้สามเหลี่ยม ให้สังเกตข้อมูลที่ให้มา: รู้ 2 ด้าน+มุมคั่น หรือรู้ 3 ด้าน → ใช้กฎโคไซน์; รู้มุม-ด้านตรงข้ามคู่หนึ่ง → ใช้กฎไซน์\n4. **จำนวนเชิงซ้อน**: Z·Z̄ = |Z|² คือกุญแจสำคัญที่ใช้หาอินเวอร์สและการหารแทบทุกโจทย์\n5. รูปเชิงขั้วกับทฤษฎีเดอมัวร์ทำให้การยกกำลังสูงและถอดรากง่ายขึ้นมาก ต้องแปลง a+bi → r(cos θ+i sin θ) ให้คล่อง\n6. รากของพหุนามสัมประสิทธิ์จริงเกิดเป็นคู่สังยุคเสมอ ใช้ตรวจสอบคำตอบและช่วยลดรูปสมการดีกรีสูงได้"}]</script>

  // ================= API =================
  // การเรียกที่อ่านข้อมูลอย่างเดียว (ไม่มีผลข้างเคียงถ้ายิงซ้ำ) — ปลอดภัยที่จะลองใหม่อัตโนมัติเมื่อเน็ตสะดุด
  // (มือถือ โดยเฉพาะ iOS มักเจอเน็ตสะดุดชั่วครู่บ่อยกว่า — ลองใหม่เงียบๆ ช่วยลดอาการ "เชื่อมต่อไม่ได้" ที่ผู้ใช้เจอ)
  var RETRYABLE_ACTIONS = { ping: 1, checkSession: 1, getQuestions: 1, checkAnswer: 1, getHistory: 1, adminListUsers: 1, adminListAttempts: 1 };
  function api(action, payload, _attempt) {
    payload = payload || {};
    payload.action = action;
    if (state.user && !payload.username) { payload.username = state.user.username; payload.token = state.user.token; }
    if (!SERVER_URL || SERVER_URL.indexOf('PASTE_') === 0) {
      return Promise.resolve({ ok: false, error: 'server_not_configured' });
    }
    var attempt = _attempt || 0;
    return fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); })
      .catch(function () {
        if (RETRYABLE_ACTIONS[action] && attempt < 2) {
          return new Promise(function (resolve) {
            setTimeout(function () { resolve(api(action, payload, attempt + 1)); }, 500 * (attempt + 1));
          });
        }
        return { ok: false, error: 'network_error' };
      });
  }

  function beginQuiz(questions, mode, subject, timeLimitSec) {
    state.quiz = {
      questions: questions,
      mode: mode,
      subject: subject,
      idx: 0,
      answers: {}, // id -> selectedIndex
      reveals: {}, // id -> {answer, reasoning} — เฉลย+เหตุผลที่เปิดเผยแล้วทีละข้อ (โหมดฝึกทำ)
      startedAt: new Date().toISOString(),
      timeLimitSec: timeLimitSec,
      deadline: timeLimitSec ? (Date.now() + timeLimitSec * 1000) : null,
      remainingSec: timeLimitSec,
      showFeedback: mode === 'practice', // ฝึกทำ: ดูเฉลยได้ทันทีหลังเลือก
      timerHandle: null,
    };
    state.view = 'quiz';
    if (timeLimitSec) startTimer();
    if (state.user) startSessionPoll();
    render();
  }

  function startTimer() {
    if (state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
    state.quiz.timerHandle = setInterval(tickTimer, 1000);
  }
  // คำนวณเวลาที่เหลือจาก deadline (นาฬิกาจริง) แทนการนับถอยหลังทีละวินาที
  // เพราะมือถือ (โดยเฉพาะ iOS) มักหน่วง/ข้าม setInterval เวลาสลับแอปหรือพับหน้าจอ
  // ถ้านับถอยหลังแบบเดิมจะทำให้เวลานาฬิกาคลาดเคลื่อนจากเวลาจริงได้มาก ("หน่วง"/ไม่ตรง)
  function tickTimer() {
    if (!state.quiz || !state.quiz.deadline) return;
    var remaining = Math.max(0, Math.round((state.quiz.deadline - Date.now()) / 1000));
    state.quiz.remainingSec = remaining;
    if (remaining <= 0) {
      clearInterval(state.quiz.timerHandle);
      finishQuiz();
      return;
    }
    var t = document.getElementById('quiz-timer');
    if (t) {
      t.textContent = fmtTime(remaining);
      t.className = 'timer' + (remaining < 60 ? ' low' : '');
    }
  }
  function fmtTime(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  // เหตุผลที่ถือว่าเซสชันถูกตัดออกจริง ๆ (server ยืนยันชัดเจนว่าบัญชีถูกล็อกอินที่อื่น/ถูกระงับ/ไม่พบผู้ใช้)
  // ข้อผิดพลาดชั่วคราว (เน็ตหลุด, เซิร์ฟเวอร์ตอบช้า/error ชั่วคราว) จะ "ไม่" ทำให้ถูกตัดออกจากระบบ
  // เพื่อป้องกันไม่ให้ผู้ใช้ถูกเตะออกกลางคันทั้งที่ไม่ได้ล็อกอินที่อื่นจริง
  var TERMINAL_KICK_REASONS = { kicked: 1, suspended: 1, invalid_session: 1 };
  function startSessionPoll() {
    stopSessionPoll();
    state.sessionPollFailStreak = 0;
    state.sessionPoll = setInterval(function () {
      if (!state.user) return;
      api('checkSession', {}).then(function (res) {
        if (res.ok) { state.sessionPollFailStreak = 0; return; }
        if (!TERMINAL_KICK_REASONS[res.error]) {
          // network_error / server_error / sheets_not_setup ฯลฯ — ปัญหาชั่วคราว ลองใหม่รอบถัดไป ไม่ตัดออก
          return;
        }
        // ยืนยันซ้ำก่อนตัดออกจริง กันกรณี Sheets อ่านข้อมูลสะดุดชั่วครู่แล้วรายงานผลผิดแบบต่อเนื่องผิดจังหวะ
        state.sessionPollFailStreak = (state.sessionPollFailStreak || 0) + 1;
        if (state.sessionPollFailStreak >= 2) { handleKicked(res.error); }
      });
    }, 30000); // เดิม 15 วิ ลดความถี่ลงครึ่งหนึ่งเพื่อลดจำนวนการเชื่อมต่อพื้นหลังที่แย่งกับ request จริงของผู้ใช้ (โดยเฉพาะบนเน็ตมือถือ/iOS ที่สะดุดง่าย)
  }
  function stopSessionPoll() {
    if (state.sessionPoll) { clearInterval(state.sessionPoll); state.sessionPoll = null; }
    state.sessionPollFailStreak = 0;
  }
  function handleKicked(reason) {
    stopSessionPoll();
    if (state.quiz && state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
    state.user = null; saveSession();
    state.quiz = null;
    state.error = errMsg(reason === 'suspended' ? 'suspended' : (reason === 'invalid_session' ? 'invalid_session' : 'kicked'));
    state.view = 'home';
    render();
  }

  function viewQuiz() {
    var qz = state.quiz;
    var q = qz.questions[qz.idx];
    var total = qz.questions.length;
    var selected = qz.answers[q.id];
    var pct = Math.round((qz.idx) / total * 100);
    var reveal = qz.reveals[q.id]; // {answer, reasoning} เมื่อเปิดเผยแล้ว (โหมดฝึกทำ)

    var out = '<div class="card">';
    out += '<div class="progressbar"><div class="progressbar-fill" style="width:' + pct + '%"></div></div>';
    out += '<div class="q-meta"><span>ข้อ ' + (qz.idx + 1) + ' / ' + total + (qz.subject && qz.subject !== 'all' && qz.subject !== 'demo' ? ' · ' + esc(subjectName(qz.subject)) : '') + '</span>';
    if (qz.timeLimitSec) out += '<span id="quiz-timer" class="timer">' + fmtTime(qz.remainingSec) + '</span>';
    out += '</div>';
    out += '<div class="q-text">' + esc(q.text) + '</div>';
    out += imgHtml(q.image);
    out += '<div class="choice-list">';
    q.choices.forEach(function (c, i) {
      var cls = 'choice-btn';
      if (reveal) {
        if (i === reveal.answer) cls += ' correct';
        else if (i === selected) cls += ' wrong';
      } else if (selected === i) {
        cls += ' selected';
      }
      var disabled = (qz.showFeedback && selected !== undefined) ? ' disabled' : '';
      out += '<button class="' + cls + '" data-action="selectChoice" data-i="' + i + '"' + disabled + '>' +
        '<span class="choice-letter">' + letter(i) + '</span><span>' + esc(c) + '</span></button>';
    });
    out += '</div>';

    if (qz.showFeedback && selected !== undefined) {
      if (!reveal) {
        out += '<div class="muted" style="margin-top:10px">กำลังโหลดเฉลย…</div>';
      } else if (reveal.reasoning) {
        out += '<div class="reasoning-box" style="margin-top:12px;padding:12px 14px;background:rgba(47,220,132,0.06);border-left:3px solid var(--pcb);border-radius:6px">' +
          '<strong>เหตุผล:</strong> ' + esc(reveal.reasoning) + '</div>';
      }
    }

    out += '<div class="btn-row" style="margin-top:18px">';
    if (qz.idx > 0) out += '<button class="btn" data-action="prevQ">‹ ก่อนหน้า</button>';
    if (qz.idx < total - 1) out += '<button class="btn btn-primary" data-action="nextQ">ถัดไป ›</button>';
    else out += '<button class="btn btn-primary" data-action="finishQ">ส่งคำตอบ ✓</button>';
    out += '<button class="btn btn-ghost" data-action="abortQuiz">ออกจากแบบทดสอบ</button>';
    out += '</div></div>';
    return out;
  }

  function selectChoice(i) {
    var qz = state.quiz;
    var q = qz.questions[qz.idx];
    if (qz.showFeedback && qz.answers[q.id] !== undefined) return; // ดูเฉลยแล้ว ห้ามแก้
    qz.answers[q.id] = i;
    if (qz.showFeedback) {
      if (state.isDemo) {
        // เฉลย/เหตุผลของคำถามตัวอย่างฝังอยู่ในตัวคำถามอยู่แล้ว เปิดเผยได้ทันทีไม่ต้องเรียกเซิร์ฟเวอร์
        qz.reveals[q.id] = { answer: q.answer, reasoning: q.reasoning || null };
        render();
      } else {
        render(); // แสดงสถานะ "กำลังโหลดเฉลย…" ระหว่างรอเซิร์ฟเวอร์ตอบกลับ
        api('checkAnswer', { id: q.id }).then(function (res) {
          if (res.ok) qz.reveals[q.id] = { answer: res.answer, reasoning: res.reasoning };
          if (state.quiz === qz) render();
        });
      }
    } else {
      render();
    }
  }

  function finishQuiz() {
    var qz = state.quiz;
    stopSessionPoll();
    if (qz.timerHandle) clearInterval(qz.timerHandle);
    var answersArr = qz.questions.map(function (q) { return { id: q.id, selected: qz.answers[q.id] === undefined ? -1 : qz.answers[q.id] }; });

    if (state.isDemo) {
      var score = 0;
      var detail = qz.questions.map(function (q) {
        var sel = qz.answers[q.id];
        var ok = sel === q.answer;
        if (ok) score++;
        return { id: q.id, text: q.text, choices: q.choices, selected: sel, correct: q.answer, isCorrect: ok, image: q.image, reasoning: q.reasoning || null };
      });
      state.lastResult = { score: score, total: qz.questions.length, detail: detail, mode: 'demo' };
      state.quiz = null; state.view = 'result'; render();
      return;
    }

    api('submitAttempt', { mode: qz.mode, subject: qz.subject, answers: answersArr, startedAt: qz.startedAt }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); state.view = 'home'; state.quiz = null; render(); return; }
      var detail = res.detail.map(function (d) {
        var q = qz.questions.filter(function (x) { return x.id === d.id; })[0];
        return { id: d.id, text: q.text, choices: q.choices, selected: d.selected, correct: d.correct, isCorrect: d.isCorrect, image: q.image, reasoning: d.reasoning || null };
      });
      state.lastResult = { score: res.score, total: res.total, detail: detail, mode: qz.mode };
      state.quiz = null; state.view = 'result'; render();
    });
  }

  var readingCtx = { id: null };

  // แปลง markdown แบบง่าย (##/###/####, **ตัวหนา**, *เอียง*, - บุลเล็ต, 1. ลำดับเลข) เป็น HTML
  function mdInline(text) {
    var escd = esc(text);
    escd = escd.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    escd = escd.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return escd;
  }
  function mdToHtml(md) {
    var lines = (md || '').split('\n');
    var html = '';
    var listOpen = null; // 'ul' | 'ol' | null
    function closeList() { if (listOpen) { html += '</' + listOpen + '>'; listOpen = null; } }
    lines.forEach(function (raw) {
      var line = raw.replace(/\s+$/, '');
      var m;
      if (!line.trim()) { closeList(); return; }
      if ((m = line.match(/^####\s+(.*)/))) { closeList(); html += '<h5>' + mdInline(m[1]) + '</h5>'; return; }
      if ((m = line.match(/^###\s+(.*)/))) { closeList(); html += '<h4>' + mdInline(m[1]) + '</h4>'; return; }
      if ((m = line.match(/^##\s+(.*)/))) { closeList(); html += '<h3>' + mdInline(m[1]) + '</h3>'; return; }
      if ((m = line.match(/^#\s+(.*)/))) { closeList(); html += '<h2>' + mdInline(m[1]) + '</h2>'; return; }
      if ((m = line.match(/^\s*-\s+(.*)/))) {
        if (listOpen !== 'ul') { closeList(); html += '<ul>'; listOpen = 'ul'; }
        html += '<li>' + mdInline(m[1]) + '</li>'; return;
      }
      if ((m = line.match(/^\s*\d+\.\s+(.*)/))) {
        if (listOpen !== 'ol') { closeList(); html += '<ol>'; listOpen = 'ol'; }
        html += '<li>' + mdInline(m[1]) + '</li>'; return;
      }
      closeList();
      html += '<p>' + mdInline(line) + '</p>';
    });
    closeList();
    return html;
  }

  // สมาชิกที่ล็อกอินได้แล้ว (state.user มีค่า) คือผ่านการอนุมัติจากแอดมินแล้วเสมอ
  // (บัญชีที่ยังรออนุมัติจะถูกกันไม่ให้ล็อกอินสำเร็จตั้งแต่ขั้นตอน login)
  var READING_PREVIEW_RATIO = 0.35; // สัดส่วนเนื้อหาที่เปิดให้อ่านฟรีก่อนสมัคร/ล็อกอิน

  function truncateMarkdown(md, ratio) {
    var blocks = (md || '').split(/\n\s*\n/);
    var totalLen = md.length;
    var limit = Math.max(400, Math.floor(totalLen * ratio));
    var acc = '';
    for (var i = 0; i < blocks.length; i++) {
      var next = acc ? acc + '\n\n' + blocks[i] : blocks[i];
      if (acc && next.length > limit) break;
      acc = next;
    }
    return acc;
  }

  // ================= EVENT BINDING =================
  function bindEvents() {
    root.querySelectorAll('[data-go]').forEach(function (el) {
      el.addEventListener('click', function () { state.error = ''; state.view = el.getAttribute('data-go'); if (state.view === 'register') state.justRegistered = false; render(); if (state.view === 'history') loadHistory(); });
    });
    root.querySelectorAll('[data-action]').forEach(function (el) {
      el.addEventListener('click', function () { handleAction(el.getAttribute('data-action'), el); });
    });
  }

  function handleAction(action, el) {
    if (action === 'startDemo') { startDemo(); return; }
    if (action === 'doLogin') { doLogin(); return; }
    if (action === 'doRegister') { doRegister(); return; }
    if (action === 'logout') { doLogout(); return; }
    if (action === 'startExamCustom') { startExamCustom(); return; }
    if (action === 'examSelectAll') { document.querySelectorAll('.exam-subj-checkbox').forEach(function (c) { c.checked = true; }); return; }
    if (action === 'examSelectNone') { document.querySelectorAll('.exam-subj-checkbox').forEach(function (c) { c.checked = false; }); return; }
    if (action === 'practiceSubject') { practiceCtx.subject = el.getAttribute('data-subject'); state.view = 'practiceSetup'; render(); return; }
    if (action === 'openReading') { readingCtx.id = el.getAttribute('data-id'); state.view = 'readingDetail'; render(); return; }
    if (action === 'fillPracticeCount') {
      var fpc = document.getElementById('f-practice-count');
      if (fpc) fpc.value = el.getAttribute('data-count');
      return;
    }
    if (action === 'startPracticeCustom') { startPracticeCustom(); return; }
    if (action === 'selectChoice') { selectChoice(parseInt(el.getAttribute('data-i'), 10)); return; }
    if (action === 'nextQ') { state.quiz.idx++; render(); return; }
    if (action === 'prevQ') { state.quiz.idx--; render(); return; }
    if (action === 'finishQ') { finishQuiz(); return; }
    if (action === 'abortQuiz') { abortQuiz(); return; }
    if (action === 'adminLoad') { adminLoad(); return; }
    if (action === 'adminTab') { state.admin.tab = el.getAttribute('data-tab'); render(); return; }
    if (action === 'adminApprove') { adminAction('adminApprove', { username: el.getAttribute('data-u') }); return; }
    if (action === 'adminSuspend') { adminAction('adminSuspend', { username: el.getAttribute('data-u') }); return; }
    if (action === 'adminDelete') {
      if (!confirm('ยืนยันลบผู้ใช้ ' + el.getAttribute('data-u') + '?')) return;
      var delHist = confirm('ต้องการลบประวัติคะแนนของผู้ใช้นี้ด้วยหรือไม่? (ตกลง = ลบด้วย, ยกเลิก = เก็บไว้)');
      adminAction('adminDeleteUser', { username: el.getAttribute('data-u'), deleteHistory: delHist });
      return;
    }
    if (action === 'adminReset') {
      var pw = prompt('ตั้งรหัสผ่านใหม่ให้ผู้ใช้ ' + el.getAttribute('data-u') + ' (อย่างน้อย 6 ตัวอักษร)');
      if (!pw) return;
      adminAction('adminResetPassword', { username: el.getAttribute('data-u'), newPassword: pw });
      return;
    }
    if (action === 'adminDeleteAttempt') {
      if (!confirm('ยืนยันลบประวัตินี้?')) return;
      adminAction('adminDeleteAttempt', { attemptId: el.getAttribute('data-id') });
      return;
    }
  }

  function doLogin() {
    var username = document.getElementById('f-username').value.trim();
    var password = document.getElementById('f-password').value;
    state.error = '';
    api('login', { username: username, password: password }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); render(); return; }
      state.user = { username: res.username, token: res.token };
      saveSession();
      state.view = 'home';
      render();
    });
  }

  function doRegister() {
    var username = document.getElementById('f-username').value.trim();
    var password = document.getElementById('f-password').value;
    var password2 = document.getElementById('f-password2').value;
    if (password !== password2) { state.error = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน'; render(); return; }
    state.error = '';
    api('register', { username: username, password: password }).then(function (res) {
      if (!res.ok) { state.error = errMsg(res.error); render(); return; }
      state.lastRegisteredUsername = username;
      state.justRegistered = true;
      state.view = 'register';
      state.error = '';
      render();
    });
  }

  function doLogout() {
    api('logout', {});
    stopSessionPoll();
    state.user = null;
    saveSession();
    state.view = 'home';
    render();
  }

  // ================= BOOT =================
  // เวลากลับมาเปิดแอปอีกครั้ง (สลับแอป/ล็อกจอ) รีเฟรชนาฬิกาจับเวลาทันที แทนที่จะรอ setInterval ติ๊กถัดไป
  // ซึ่งบน iOS อาจถูกหน่วงไว้นานจนตัวเลขที่โชว์ค้างไม่ตรงกับเวลาจริง
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.quiz && state.quiz.timerHandle) { tickTimer(); }
  });
  loadSession();
  render();
  checkVersion();
  if (state.user) startSessionPoll();
})();
</script>
</body>
</html>
