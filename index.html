<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบแบบทดสอบออนไลน์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f3f1e6; --bg-alt: #e9e7d7; --ink: #23281c; --muted: #6b6f5c;
    --olive: #3b4b36; --olive-deep: #222b1f; --olive-fill: #e2e8d6;
    --khaki: #cdbf95; --khaki-fill: #efe9d4; --card: #fbf9ee; --line: #d3d1ba;
    --pink-fill: #f6dee4; --pink-line: #a83a5c; --pink-deep: #7d2740;
    --rust: #a33b2e; --rust-fill: #f4ddd8; --rust-deep: #7a2418;
    --gold: #b8860b; --good: #2e6b3e; --good-fill: #dcebe0; --shadow: rgba(34,43,31,0.14);
    --circuit-line: rgba(30,95,140,0.16); --circuit-dot: rgba(30,95,140,0.30);
    --glow-cyan: rgba(60,170,215,0.30); --glow-gold: rgba(210,164,60,0.24); --glow-rose: rgba(160,55,90,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171b13; --bg-alt: #1e2317; --ink: #ece7d6; --muted: #a7a68e;
      --olive: #93a780; --olive-deep: #d3ddc4; --olive-fill: #26301f;
      --khaki: #b8ab7c; --khaki-fill: #2c2919; --card: #20251a; --line: #3a3f2c;
      --pink-fill: #3c2430; --pink-line: #e28ba5; --pink-deep: #f3b4c6;
      --rust: #d97a68; --rust-fill: #34201b; --rust-deep: #f0a996;
      --gold: #dcb04a; --good: #7fc48d; --good-fill: #1c3324; --shadow: rgba(0,0,0,0.5);
      --circuit-line: rgba(110,205,255,0.09); --circuit-dot: rgba(110,205,255,0.18);
      --glow-cyan: rgba(110,220,255,0.30); --glow-gold: rgba(220,176,74,0.20); --glow-rose: rgba(216,110,140,0.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171b13; --bg-alt: #1e2317; --ink: #ece7d6; --muted: #a7a68e;
    --olive: #93a780; --olive-deep: #d3ddc4; --olive-fill: #26301f;
    --khaki: #b8ab7c; --khaki-fill: #2c2919; --card: #20251a; --line: #3a3f2c;
    --pink-fill: #3c2430; --pink-line: #e28ba5; --pink-deep: #f3b4c6;
    --rust: #d97a68; --rust-fill: #34201b; --rust-deep: #f0a996;
    --gold: #dcb04a; --good: #7fc48d; --good-fill: #1c3324; --shadow: rgba(0,0,0,0.5);
    --circuit-line: rgba(110,205,255,0.09); --circuit-dot: rgba(110,205,255,0.18);
    --glow-cyan: rgba(110,220,255,0.30); --glow-gold: rgba(220,176,74,0.20); --glow-rose: rgba(216,110,140,0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Sarabun','Noto Sans Thai',sans-serif; line-height: 1.7; min-height: 100vh; }
  /* Tech/electric backdrop: a faint circuit grid with a few soft glowing nodes, fixed
     behind everything. Kept low-opacity and layered under #app (and well under
     #fxlayer's z-index:40) so it reads as ambient texture — not something that
     competes with page content or the fireworks/plum effects. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 14% 20%, var(--glow-cyan), transparent 30%),
      radial-gradient(circle at 88% 78%, var(--glow-gold), transparent 32%),
      radial-gradient(circle at 80% 12%, var(--glow-rose), transparent 26%),
      repeating-linear-gradient(0deg, var(--circuit-line) 0 1px, transparent 1px 42px),
      repeating-linear-gradient(90deg, var(--circuit-line) 0 1px, transparent 1px 42px),
      radial-gradient(var(--circuit-dot) 1.4px, transparent 1.6px);
    background-size: auto, auto, auto, 42px 42px, 42px 42px, 42px 42px;
    animation: circuitPulse 9s ease-in-out infinite;
  }
  @keyframes circuitPulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
  #app { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }
  h1,h2,h3 { font-family: 'Taviraj','Noto Serif Thai',serif; font-weight: 600; color: var(--olive-deep); margin: 0 0 10px; text-wrap: balance; }
  h1 { font-size: clamp(24px,5vw,32px); } h2 { font-size: clamp(20px,4vw,26px); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--rust); margin: 0 0 8px; }
  .backlink { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); text-decoration: none; margin-bottom: 18px; cursor: pointer; }
  .backlink:hover { color: var(--ink); }

  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
  @media (max-width: 520px) { .menu-grid { grid-template-columns: 1fr; } }
  .menu-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 20px;
    cursor: pointer; text-align: left; box-shadow: 0 2px 10px var(--shadow); transition: transform .15s ease;
  }
  .menu-card:hover { transform: translateY(-2px); }
  .menu-card .ico { font-size: 30px; margin-bottom: 10px; display: block; }
  .menu-card h3 { margin-bottom: 4px; }
  .menu-card p { color: var(--muted); font-size: 14px; margin: 0; }
  .admin-entry { margin-top: 30px; text-align: center; }
  .admin-entry button { background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 8px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 6px var(--shadow); }
  .timeline { border-left: 3px solid var(--khaki); margin-left: 14px; padding-left: 22px; }
  .timeline .step { position: relative; margin-bottom: 22px; }
  .timeline .step::before { content: attr(data-n); position: absolute; left: -33px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--olive); color: var(--card); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .timeline .step h3 { font-size: 16px; margin-bottom: 4px; }
  .timeline .step p { font-size: 14px; color: var(--muted); margin: 0; }
  .chain-box { background: var(--olive-fill); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 8px; }
  .chain-box .lvl { font-size: 12px; font-weight: 700; color: var(--rust); text-transform: uppercase; letter-spacing: .05em; }
  .chain-box h3 { font-size: 16px; margin: 4px 0; }
  .chain-box p { font-size: 14px; color: var(--muted); margin: 0; }
  .chain-arrow { text-align: center; font-size: 20px; color: var(--khaki); margin: 2px 0; }
  .note-box { font-size: 13px; color: var(--muted); background: var(--khaki-fill); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }

  label.field { display: block; margin-bottom: 16px; }
  label.field span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 15px; font-family: inherit;
  }
  input:focus { outline: 2px solid var(--olive); outline-offset: 1px; }
  button.primary {
    background: var(--olive); color: var(--card); border: none; border-radius: 999px;
    padding: 13px 26px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.ghost {
    background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px;
    padding: 11px 22px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .err { color: var(--rust-deep); font-size: 13px; margin-top: -8px; margin-bottom: 12px; }

  .waitwrap { text-align: center; padding: 50px 10px; }
  .waitwrap .avatar, .waitwrap .avatar-ph { display: block; margin: 0 auto 16px; }
  .waitwrap .spin { width: 42px; height: 42px; border: 4px solid var(--line); border-top-color: var(--olive); border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waitcount { font-size: 13px; color: var(--muted); margin-top: 10px; }

  .qbar { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 5; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .qbar .timerrow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .qbar .timernum { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--rust-deep); }
  .progressline { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .progressline i { display: block; height: 100%; background: var(--olive); transition: width .3s ease; }

  .qcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .qcard .qn { font-size: 12px; font-weight: 700; color: var(--rust); margin-bottom: 6px; }
  .qcard .qtext { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .choice { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .choice:hover { background: var(--bg-alt); }
  .choice.sel { background: var(--olive-fill); border-color: var(--olive); }
  .choice input { margin-top: 3px; }
  .choice .lab { font-size: 14px; }
  .submitbar { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0; border-top: 1px solid var(--line); text-align: center; }

  .rankrow { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; position: relative; overflow: visible; }
  .rankrow .rn { font-family: 'Taviraj',serif; font-weight: 700; font-size: 20px; width: 34px; text-align: center; color: var(--muted); }
  .rankrow.r1 { border-color: var(--gold); background: linear-gradient(90deg, var(--khaki-fill), var(--card)); }
  .rankrow.r1 .rn { color: var(--gold); font-size: 26px; }
  .rankrow.r2 .rn, .rankrow.r3 .rn { color: var(--olive); }
  .rankrow .info { flex: 1; }
  .rankrow .nm { font-weight: 600; font-size: 15px; }
  .rankrow .sub { font-size: 12px; color: var(--muted); }
  .rankrow .sc { font-family: 'Taviraj',serif; font-weight: 700; font-size: 20px; color: var(--olive-deep); }
  .rankrow.rlast { border-color: var(--rust); }
  .rankrow.shake { animation: shake .5s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  .avatar { border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); }
  .avatar-ph { display: flex; align-items: center; justify-content: center; background: var(--olive-fill); color: var(--olive-deep); font-family: 'Taviraj',serif; font-weight: 700; }

  input[type=file] { width: 100%; padding: 10px 0; font-size: 14px; font-family: inherit; color: var(--muted); }

  .scorereveal { text-align: center; padding: 36px 10px 10px; }
  .scorereveal .avatar, .scorereveal .avatar-ph { margin: 0 auto 16px; }
  .scorereveal .bignum { font-family: 'Taviraj',serif; font-weight: 700; font-size: 76px; line-height: 1; color: var(--olive-deep); animation: popin .5s cubic-bezier(.34,1.56,.64,1); }
  .scorereveal .outof { font-size: 14px; color: var(--muted); margin-top: 4px; }
  @keyframes popin { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }

  #fxlayer { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }

  .pinbox { max-width: 320px; margin: 60px auto; text-align: center; }
  .adminpanel .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: var(--olive-fill); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .stat b { font-family: 'Taviraj',serif; font-size: 18px; display: block; color: var(--olive-deep); }
  .badge-lowconf { display: inline-block; font-size: 11px; background: var(--rust-fill); color: var(--rust-deep); padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="fxlayer"></div>
<script>/* ============================================================
   แบบทดสอบ + เนื้อหาความรู้ ใบส่งซ่อมเครื่องมือสื่อสาร
   (Supabase backend — REST + polling, no Artifact dependency)

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Supabase REST helpers ---------------- */
async function sb(path, opts) {
  opts = opts || {};
  const headers = Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
  }, opts.headers || {});
  let res;
  try {
    res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    const err = new Error('network_error');
    err.network = true;
    throw err;
  }
  if (!res.ok) {
    let detail = '';
    try { detail = await res.text(); } catch (e) {}
    const err = new Error('supabase_http_' + res.status);
    err.status = res.status; err.detail = detail;
    throw err;
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function errMsgFor(err) {
  if (!err) return 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
  if (err.network) return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
  if (err.status === 401 || err.status === 403) return 'ระบบไม่มีสิทธิ์บันทึกข้อมูล (ตั้งค่าเซิร์ฟเวอร์ผิดพลาด) กรุณาแจ้งผู้จัดสอบ';
  if (err.status === 409) return 'ข้อมูลนี้มีอยู่แล้วในระบบ ลองรีเฟรชหน้าเว็บ';
  if (err.status >= 500) return 'เซิร์ฟเวอร์ขัดข้องชั่วคราว ลองใหม่อีกครั้ง';
  return 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง (หากไม่หายลองรีเฟรชหน้าเว็บ)';
}

/* Shrink + JPEG-compress a chosen photo client-side before it goes anywhere near the
   network — an uncompressed phone photo is several MB, and that would bloat every
   row in the participants table and make every poll fetch huge. */
async function resizeImageFile(file, maxDim, quality) {
  // iPhones save camera photos as HEIC by default, and only Safari can decode that —
  // Chrome/Firefox (desktop or Android) fail silently on it. Catch it early with a
  // message people can actually act on, instead of a generic "loading failed".
  if (/heic|heif/i.test(file.type || '') || /\.heic$|\.heif$/i.test(file.name || '')) {
    throw new Error('heic_unsupported');
  }
  // createImageBitmap decodes the file directly (no giant base64 string in memory
  // first), handles more formats than a plain <img>, and can auto-correct EXIF
  // rotation — which matters a lot for phone photos. Fall back to the classic
  // FileReader + <img> + canvas path for browsers/files it can't handle.
  let bitmap = null;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    try { bitmap = await createImageBitmap(file); } catch (e2) { bitmap = null; }
  }
  if (bitmap) {
    try {
      let w = bitmap.width, h = bitmap.height;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/jpeg', quality);
    } finally {
      if (bitmap.close) bitmap.close();
    }
  }
  return resizeImageFileLegacy(file, maxDim, quality);
}

function resizeImageFileLegacy(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read_error'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode_error'));
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

    sb('exam_state?id=eq.1&select=*'),
    sb('participants?select=*&order=registered_at.asc'),

  const current = participants.filter(p => p.exam_run_id === runId);
  const past = participants.filter(p => p.exam_run_id !== runId);
  const histMap = {};
  past.forEach(p => { (histMap[p.exam_run_id] = histMap[p.exam_run_id] || []).push(p); });
  const history = Object.keys(histMap).map(rid => {
    const parts = histMap[rid];
    const finishedAt = Math.max.apply(null, parts.map(p => p.submitted_at || p.registered_at || 0));
    return { examRunId: rid, finishedAt, participants: parts.map(mapParticipant) };
  }).sort((a, b) => a.finishedAt - b.finishedAt);
  STATE = {
    examRunId: runId,
    examMeta: { pin: st.pin, timeLimitMinutes: st.time_limit_minutes, status: st.status, startAt: st.start_at },
    participants: current.map(mapParticipant),
    history,
  };
  dataReady = true;
  lastLoadError = null;
}

/* ---------------- write actions ---------------- */
async function insertParticipant(data) {
  await sb('participants', {
    method: 'POST',
    headers: { 'Prefer': 'return=minimal,resolution=ignore-duplicates' },
    body: JSON.stringify([{
      id: data.id, exam_run_id: STATE.examRunId, rank: data.rank, name: data.name, svcno: data.svcno,
      photo: data.photo || null,
      registered_at: data.registeredAt, answers: data.answers || {}, submitted_at: data.submittedAt, score: data.score,
    }]),
  });
}

async function submitAnswers(participantId, answers, score, submittedAt) {
  await sb('participants?id=eq.' + encodeURIComponent(participantId) + '&submitted_at=is.null', {
    method: 'PATCH',
    headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ answers, score, submitted_at: submittedAt }),
  });
}

async function adminStartExam(timeLimitMinutes) {
  await sb('exam_state?id=eq.1&status=eq.registration', {
    method: 'PATCH',
    headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ status: 'running', start_at: Date.now(), time_limit_minutes: timeLimitMinutes }),
  });
}

async function adminResetExam() {
  const newRunId = 'run-' + Date.now();
  await sb('exam_state?id=eq.1', {
    method: 'PATCH',
    headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ exam_run_id: newRunId, status: 'registration', start_at: null, time_limit_minutes: null }),
  });
}

async function clearHistory() {
  // "History" is just every participant row from a run other than the current one —
  // clearing it means deleting those rows. The current run's own participants (its
  // exam_run_id) are untouched.
  await sb('participants?exam_run_id=neq.' + encodeURIComponent(STATE.examRunId), {
    method: 'DELETE',
    headers: { 'Prefer': 'return=minimal' },
  });
}

async function forceFinishStragglers() {
  const deadline = STATE.examMeta.startAt + STATE.examMeta.timeLimitMinutes * 60000;
  const stragglers = STATE.participants.filter(p => !p.submittedAt);
  await Promise.all(stragglers.map(p => sb('participants?id=eq.' + encodeURIComponent(p.id) + '&submitted_at=is.null', {
    method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ answers: p.answers || {}, score: scoreOf(p.answers || {}), submitted_at: deadline }),
  })));
  await sb('exam_state?id=eq.1&status=eq.running', {
    method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ status: 'finished' }),
  });
}

async function maybeMarkFinished() {
  if (STATE.examMeta.status !== 'running') return;
  if (STATE.participants.length === 0) return;
  if (!STATE.participants.every(p => p.submittedAt)) return;
  await sb('exam_state?id=eq.1&status=eq.running', {
    method: 'PATCH', headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ status: 'finished' }),
  });
}

function scoreOf(answers) {
  let sc = 0;
  QUESTIONS.forEach(q => { if (answers[q.id] === q.correct) sc++; });
  return sc;
}

function localKey() { return 'qz_p_' + STATE.examRunId; }
function getLocalParticipantId() { try { return localStorage.getItem(localKey()); } catch (e) { return null; } }
function setLocalParticipantId(id) { try { localStorage.setItem(localKey(), id); } catch (e) {} }
function myParticipant() { const id = getLocalParticipantId(); return id ? STATE.participants.find(p => p.id === id) : null; }

/* ---------------- routing ---------------- */
function go(hash) { location.hash = hash; }
window.addEventListener('hashchange', render);
window.addEventListener('load', async () => {
  try { await fetchState(); } catch (e) { lastLoadError = e; }
  render();
  setInterval(tick, 1000);
  setInterval(pollTick, 2000);
});

function tick() {
  const v = currentRoute();
  if (v[0] === 'quiz' && dataReady && STATE.examMeta.status === 'running') updateTimerUI();
}

async function pollTick() {
  const prevStatus = STATE.examMeta.status;
  const prevRunId = STATE.examRunId;
  try {
    await fetchState();
    const route = currentRoute();
    const me = myParticipant();
    const onQuizRoute = route[0] === 'quiz';
    const onAdminRoute = route[0] === 'admin';
    const amActivelyTakingExam = onQuizRoute && STATE.examMeta.status === 'running' && me && !me.submittedAt;
    // None of these views show anything that needs a live refresh, so blindly
    // re-rendering them on every 2s poll only ever does harm: it tears down and
    // rebuilds the input, which wipes out whatever the person is mid-typing and reads
    // as "I can't type anything into this field."
    const amFillingRegistration = onQuizRoute && !me && STATE.examMeta.status === 'registration';
    const amAtAdminPinGate = onAdminRoute && !isAdminUnlocked();
    const amEditingTimeLimit = onAdminRoute && isAdminUnlocked() && document.activeElement && document.activeElement.id === 'timeLimitInput';
    // Once an exam run is finished nothing about it changes again (scores are fixed,
    // no one new can register into a finished run) — re-rendering every 2s here would
    // only flicker the score-reveal / ranking screen and restart its animation.
    const onFinishedScreen = onQuizRoute && STATE.examMeta.status === 'finished';
    const transitioned = STATE.examMeta.status !== prevStatus || STATE.examRunId !== prevRunId;
    // While someone is mid-exam, mid-registration, at the admin PIN gate, or editing the
    // time-limit field, don't blow away their view (and any in-progress typing/click)
    // just because the 2s poll refreshed — only re-render if something actually changed
    // for them (e.g. force-finished, or exam started while they were filling a form).
    // Everywhere else (waiting room, submitted-wait, the rest of the admin panel) live
    // counts are exactly what we want.
    const skipRender = amActivelyTakingExam || amFillingRegistration || amAtAdminPinGate || amEditingTimeLimit || onFinishedScreen;
    if (!skipRender || transitioned) render();
    await deadlineWatch();
  } catch (e) {
    lastLoadError = e;
    // keep last known state on screen; don't wipe UI for a transient network hiccup
  }
}

async function deadlineWatch() {
  if (deadlineHandling) return;
  if (STATE.examMeta.status !== 'running' || !STATE.examMeta.startAt || !STATE.examMeta.timeLimitMinutes) return;
  const deadline = STATE.examMeta.startAt + STATE.examMeta.timeLimitMinutes * 60000;
  if (Date.now() < deadline) return;
  deadlineHandling = true;
  try { await forceFinishStragglers(); await fetchState(); render(); }
  catch (e) { /* another client likely already handled it */ }
  finally { deadlineHandling = false; }
}

function currentRoute() {
  const h = (location.hash || '#/').slice(2).split('/').filter(Boolean);
  return h.length ? h : [''];
}

/* ---------------- render dispatcher ---------------- */
function render() {
  const r = currentRoute();
  const app = document.getElementById('app');
  if (r[0] === '' || r[0] === undefined) app.innerHTML = viewHome();
  else if (r[0] === 'content' && !r[1]) app.innerHTML = viewContentMenu();
  else if (r[0] === 'content' && r[1] === 'pink') app.innerHTML = viewPink();
  else if (r[0] === 'content' && r[1] === 'chain') app.innerHTML = viewChain();
  else if (r[0] === 'quiz') app.innerHTML = dataReady ? viewQuizRouter() : viewLoading();
  else if (r[0] === 'admin') app.innerHTML = dataReady ? viewAdmin() : viewLoading();
  else app.innerHTML = viewHome();
  bindEvents();
  maybePlayRevealFx();
  maybePlayRankFx();
}

  return `<div class="waitwrap"><div class="spin"></div><p class="muted">กำลังโหลดข้อมูล...</p></div>`;
}

  cancelRevealAutoAdvance();

function viewQuizRouter() {
  const me = myParticipant();
  if (!me) return viewRegister();
  if (STATE.examMeta.status === 'finished') {
    // Show each person their own score first — the full ranking (and the fireworks/
    // plum-drop for it) only appears once they choose to see it, so nobody sees where
    // they landed relative to everyone else until they're ready.
    if (!isRevealed()) return viewScoreReveal(me);
    return viewResults(me);
  }
  if (STATE.examMeta.status === 'running') {

}

    const top = ranked[0];
    const dateStr = new Date(run.finishedAt).toLocaleString('th-TH');
    return `
    <details class="card" style="margin-bottom:10px">
      <summary style="cursor:pointer;font-weight:600">${dateStr} — ${ranked.length} คน${top ? ` — สูงสุด ${top.score}/${QUESTIONS.length} (${esc(top.name)})` : ''}</summary>
      <div style="margin-top:12px">
        ${ranked.map((p, i) => `<div class="rankrow" style="margin-bottom:6px"><div class="rn">${i + 1}</div>${avatarHtml(p, 36)}<div class="info"><div class="nm">${esc(p.rank)} ${esc(p.name)}</div><div class="sub">${esc(p.svcno)}</div></div><div class="sc">${p.submittedAt ? p.score : '—'}</div></div>`).join('')}
      </div>
    </details>`;
  }).join('');
  return `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:24px;flex-wrap:wrap;gap:8px">
    <h3 style="margin:0">ประวัติผลสอบ (${hist.length} รอบ)</h3>
    <button class="ghost" id="clearHistoryBtn" style="font-size:13px;padding:8px 16px">ล้างประวัติทั้งหมด</button>
  </div>
  ${rows}`;
}

/* ---------------- helpers: timer / draft answers ---------------- */
function fmtTime(ms) {
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60), ss = s % 60;
  return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
function answeredPct() { return QUESTIONS.length ? Math.round(100 * Object.keys(myAnswers).length / QUESTIONS.length) : 0; }
function draftKey(pid) { return 'qz_draft_' + STATE.examRunId + '_' + pid; }
function loadDraftAnswers(pid) { try { return JSON.parse(sessionStorage.getItem(draftKey(pid)) || 'null'); } catch (e) { return null; } }
function saveDraftAnswers(pid) { try { sessionStorage.setItem(draftKey(pid), JSON.stringify(myAnswers)); } catch (e) {} }

function updateTimerUI() {
  const el = document.getElementById('timerNum');
  if (!el) return;
  const deadline = STATE.examMeta.startAt + STATE.examMeta.timeLimitMinutes * 60000;
  const remain = Math.max(0, deadline - Date.now());
  el.textContent = fmtTime(remain);
  if (remain <= 0) render();
}

/* ---------------- events ---------------- */
function bindEvents() {
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => { cancelRevealAutoAdvance(); go(el.getAttribute('data-go')); }));

  const regForm = document.getElementById('regForm');
  let pendingPhotoDataUrl = null;
  const photoInput = document.getElementById('photoInput');
  if (photoInput) photoInput.addEventListener('change', async () => {
    const file = photoInput.files && photoInput.files[0];
    const preview = document.getElementById('photoPreview');
    if (!file) { pendingPhotoDataUrl = null; if (preview) preview.innerHTML = ''; return; }
    if (preview) preview.textContent = 'กำลังเตรียมรูป...';
    try {
      pendingPhotoDataUrl = await resizeImageFile(file, 320, 0.7);
      if (preview) preview.innerHTML = `<img src="${pendingPhotoDataUrl}" style="width:80px;height:80px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">`;
    } catch (err) {
      pendingPhotoDataUrl = null;
      if (preview) {
        preview.textContent = (err && err.message === 'heic_unsupported')
          ? 'ไฟล์รูปนี้เป็นแบบ HEIC ซึ่งเบราว์เซอร์นี้เปิดไม่ได้ — ไปที่ Settings > Camera > Formats ของ iPhone เปลี่ยนเป็น "Most Compatible" แล้วถ่ายใหม่ หรือเลือกรูปอื่น (ไม่ใส่รูปก็ลงทะเบียนได้ปกติ)'
          : 'โหลดรูปไม่สำเร็จ ลองเลือกรูปใหม่ (ไม่ใส่รูปก็ลงทะเบียนได้ปกติ)';
      }
    }
  });

  if (regForm) regForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(regForm);
    const rank = fd.get('rank').trim(), name = fd.get('name').trim(), svcno = fd.get('svcno').trim();
    const errEl = document.getElementById('regErr');
    if (!rank || !name || !svcno) { errEl.textContent = 'กรุณากรอกข้อมูลให้ครบ'; errEl.style.display = 'block'; return; }
    if (STATE.examMeta.status !== 'registration') { errEl.textContent = 'ปิดรับลงทะเบียนแล้ว การสอบเริ่มไปแล้ว'; errEl.style.display = 'block'; return; }
    const btn = regForm.querySelector('button'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    const data = { id, rank, name, svcno, photo: pendingPhotoDataUrl, registeredAt: Date.now(), answers: {}, submittedAt: null, score: null };
    try {
      await insertParticipant(data);
      setLocalParticipantId(id);
      await fetchState();
      render();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'ลงทะเบียนเข้าสอบ';
      errEl.textContent = errMsgFor(err);
      errEl.style.display = 'block';
    }
  });

  document.querySelectorAll('.choice').forEach(el => el.addEventListener('click', () => {
    const qid = Number(el.getAttribute('data-qid')), ci = Number(el.getAttribute('data-ci'));
    myAnswers[qid] = ci;
    const me = myParticipant();
    if (me) saveDraftAnswers(me.id);
    document.querySelectorAll(`.choice[data-qid="${qid}"]`).forEach(c => c.classList.remove('sel'));
    el.classList.add('sel');
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) submitBtn.textContent = `ส่งคำตอบ (${Object.keys(myAnswers).length}/${QUESTIONS.length} ข้อ)`;
    const pb = document.getElementById('qProgress'); if (pb) pb.style.width = answeredPct() + '%';
  }));

  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', async () => {
    const me = myParticipant(); if (!me) return;
    const missing = QUESTIONS.length - Object.keys(myAnswers).length;
    if (missing > 0 && !confirm(`ยังเหลือ ${missing} ข้อที่ยังไม่ได้ตอบ ต้องการส่งคำตอบเลยหรือไม่?`)) return;
    submitBtn.disabled = true; submitBtn.textContent = 'กำลังส่ง...';
    const score = scoreOf(myAnswers);
    try {
      await submitAnswers(me.id, Object.assign({}, myAnswers), score, Date.now());
      await fetchState();
      await maybeMarkFinished();
      await fetchState();
      render();
    } catch (err) {
      submitBtn.disabled = false; submitBtn.textContent = `ส่งคำตอบ (${Object.keys(myAnswers).length}/${QUESTIONS.length} ข้อ)`;
      alert(errMsgFor(err));
    }
  });

  const pinForm = document.getElementById('pinForm');
  if (pinForm) pinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const pin = new FormData(pinForm).get('pin');
    if (pin === STATE.examMeta.pin) { try { sessionStorage.setItem('qz_admin_unlocked', '1'); } catch (er) {} render(); }
    else { const el = document.getElementById('pinErr'); el.style.display = 'block'; }
  });

  const startBtn = document.getElementById('startBtn');
  if (startBtn) startBtn.addEventListener('click', async () => {
    const tl = Number(document.getElementById('timeLimitInput').value) || 20;
    startBtn.disabled = true; startBtn.textContent = 'กำลังเริ่ม...';
    try { await adminStartExam(tl); await fetchState(); render(); }
    catch (err) { startBtn.disabled = false; startBtn.textContent = 'เริ่มสอบพร้อมกัน'; alert(errMsgFor(err)); }
  });

  const showRankBtn = document.getElementById('showRankBtn');
  if (showRankBtn) {
    showRankBtn.addEventListener('click', () => advanceToRanking());
    animateScoreReveal(Number(showRankBtn.getAttribute('data-score')) || 0);
    cancelRevealAutoAdvance();
    revealAutoAdvanceTimer = setTimeout(advanceToRanking, 4000);
  }

  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.addEventListener('click', async () => {
    const msg = STATE.participants.length
      ? 'บันทึกผลรอบนี้เก็บไว้ในประวัติ แล้วล้างรายชื่อเพื่อเริ่มรอบใหม่?'
      : 'เริ่มรอบสอบใหม่?';
    if (!confirm(msg)) return;
    try { await adminResetExam(); await fetchState(); render(); }
    catch (err) { alert(errMsgFor(err)); }
  });

  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  if (clearHistoryBtn) clearHistoryBtn.addEventListener('click', async () => {
    if (!confirm('ลบประวัติผลสอบทุกรอบทิ้งถาวร (กู้คืนไม่ได้) ต้องการดำเนินการต่อหรือไม่?')) return;
    clearHistoryBtn.disabled = true; clearHistoryBtn.textContent = 'กำลังล้าง...';
    try { await clearHistory(); await fetchState(); render(); }
    catch (err) { clearHistoryBtn.disabled = false; clearHistoryBtn.textContent = 'ล้างประวัติทั้งหมด'; alert(errMsgFor(err)); }
  });
}

function animateScoreReveal(target) {
  const el = document.getElementById('revealNum');
  if (!el) return;
  const dur = 700;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(eased * target));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------------- fx: fireworks + falling plums ---------------- */
// Celebration on the personal score-reveal screen (shown before the ranking is revealed).
function maybePlayRevealFx() {
  const box = document.getElementById('scoreRevealBox');
  if (!box) return;
  const key = STATE.examRunId + ':' + (myParticipant() ? myParticipant().id : '');
  if (revealFxPlayedFor === key) return;
  revealFxPlayedFor = key;
  const rect = () => box.getBoundingClientRect();
  burstFireworks(rect, 1.2);
  setTimeout(() => burstFireworks(rect, 0.9), 350);
}

// Rank-based fireworks/plums on the full ranking page — only marks itself "played" once
// the ranking rows actually exist in the DOM, so it never gets skipped by an earlier
// visit to the score-reveal screen (which has no .rankrow elements).
function maybePlayRankFx() {
  const r = currentRoute();
  if (!(r[0] === 'quiz' && dataReady && STATE.examMeta.status === 'finished')) return;
  const rows = document.querySelectorAll('.rankrow');
  if (!rows.length) return;
  const key = STATE.examRunId;
  if (fxPlayedFor === key) return;
  fxPlayedFor = key;
  rows.forEach(row => {
    const rank = Number(row.getAttribute('data-rank'));
    const rect = () => row.getBoundingClientRect();
    if (rank === 0) { burstFireworks(rect, 1.4); setTimeout(() => burstFireworks(rect, 1.1), 350); setTimeout(() => burstFireworks(rect, 1.2), 700); }
    else if (rank === 1 || rank === 2) { burstFireworks(rect, 0.85); }
  });
  if (rows.length > 1) {
    const lastRow = rows[rows.length - 1];
    dropPlums(() => lastRow.getBoundingClientRect(), lastRow);
  }
}

function burstFireworks(getRect, scale) {
  const layer = document.getElementById('fxlayer');
  const rect = getRect();
  const cx = rect.left + rect.width * 0.15, cy = rect.top + rect.height / 2;
  // Bright, high-contrast palette (gold/white/cyan sparks over the tactical accents)
  // so the burst reads clearly instead of blending into the background.
  const colors = ['#ffd76a', '#ffffff', '#ffb3c9', '#7fe7ff', '#dcb04a', '#a83a5c'];
  // Quick bright flash at the origin for impact.
  const flash = document.createElement('div');
  const flashSize = 26 * scale;
  flash.style.cssText = `position:fixed;left:${cx - flashSize / 2}px;top:${cy - flashSize / 2}px;width:${flashSize}px;height:${flashSize}px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffe9a8 40%,rgba(255,233,168,0) 75%);opacity:1;transition:transform .5s ease-out,opacity .5s ease-out;transform:scale(0.4);pointer-events:none;`;
  layer.appendChild(flash);
  requestAnimationFrame(() => { flash.style.transform = 'scale(2.4)'; flash.style.opacity = '0'; });
  setTimeout(() => flash.remove(), 550);

  const n = Math.round(34 * scale);
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.3;
    const dist = (55 + Math.random() * 90) * scale;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const size = (5 + Math.random() * 4) * scale;
    const color = colors[i % colors.length];
    p.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;border-radius:50%;background:${color};box-shadow:0 0 ${6 * scale}px ${2 * scale}px ${color};opacity:1;transition:transform .9s cubic-bezier(.15,.7,.25,1), opacity .9s ease;transform:translate(0,0);pointer-events:none;`;
    layer.appendChild(p);
    requestAnimationFrame(() => { p.style.transform = `translate(${dx}px, ${dy + 34}px)`; p.style.opacity = '0'; });
    setTimeout(() => p.remove(), 1000);
  }
}

function dropPlums(getRect, rowEl) {
  const layer = document.getElementById('fxlayer');
  const rect = getRect();
  const n = 18;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    const x = rect.left + Math.random() * rect.width;
    const rot = Math.random() * 360;
    const delay = Math.random() * 550;
    const size = 22 + Math.random() * 14;
    p.innerHTML = plumSVG();
    p.style.cssText = `position:fixed;left:${x}px;top:-40px;width:${size}px;height:${size}px;transform:rotate(${rot}deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));transition:top 1.05s cubic-bezier(.5,0,.9,1) ${delay}ms, transform 1.05s linear ${delay}ms;pointer-events:none;`;
    layer.appendChild(p);
    requestAnimationFrame(() => { p.style.top = (rect.top + rect.height / 2 - size / 2) + 'px'; p.style.transform = `rotate(${rot + 200}deg)`; });
    setTimeout(() => { rowEl.classList.add('shake'); p.remove(); }, 1050 + delay);
  }
}
function plumSVG() {
  return '<svg viewBox="0 0 24 24" width="22" height="22"><ellipse cx="12" cy="14" rx="8" ry="7" fill="#9a5cae"/><ellipse cx="9" cy="11" rx="2.6" ry="1.8" fill="#d0a3e0" opacity=".85"/><path d="M12 7 Q11 3 8 2" stroke="#4b6b3a" stroke-width="1.6" fill="none"/><ellipse cx="7.2" cy="2.2" rx="2.4" ry="1.3" fill="#5c8a48" transform="rotate(-30 7 2)"/></svg>';
}
